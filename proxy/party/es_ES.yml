prefix: '&d&lParty&8 » &7'
help: |-
  &8&m------&r &d&lParty &8&m------
  &d/party invite <jugador> &8- &7Invita a un jugador.
  &d/party accept <jugador> &8- &7Acepta una invitación.
  &d/party deny <jugador> &8- &7Rechaza una invitación.
  &d/party join <jugador> &8- &7Únete a una party pública.
  &d/party public &8- &7Abre tu party y la anuncia. &8(&7alias: open&8)
  &d/party private &8- &7Solo se entra con invitación.
  &d/party list &8- &7Muestra los miembros.
  &d/party chat [mensaje] &8- &7Habla con tu party o activa el chat.
  &d/party leave &8- &7Sal de la party.
  &d/party warp &8- &7Trae a la party a tu servidor.
  &d/party kick <jugador> &8- &7Expulsa a un miembro.
  &d/party promote <jugador> &8- &7Cede el liderazgo.
  &d/party disband &8- &7Disuelve la party.
usage: '&cUso: /party {action} <jugador>'


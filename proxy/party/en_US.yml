prefix: '&d&lParty&8 » &7'
help: |-
  &8&m------&r &d&lParty &8&m------
  &d/party invite <player> &8- &7Invite a player.
  &d/party accept <player> &8- &7Accept an invitation.
  &d/party deny <player> &8- &7Decline an invitation.
  &d/party join <player> &8- &7Join a public party.
  &d/party public &8- &7Open your party and announce it. &8(&7alias: open&8)
  &d/party private &8- &7Only invited players can join.
  &d/party list &8- &7Show the members.
  &d/party chat [message] &8- &7Talk to your party or toggle party chat.
  &d/party leave &8- &7Leave the party.
  &d/party warp &8- &7Bring the party to your server.
  &d/party kick <player> &8- &7Kick a member.
  &d/party promote <player> &8- &7Hand over the leadership.
  &d/party disband &8- &7Disband the party.
usage: '&cUsage: /party {action} <player>'


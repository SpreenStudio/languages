msg:
  format:
    send: '&8[&6Tú &8-> &e{target}&8] &f{message}'
    receive: '&8[&e{sender} &8-> &6Tú&8] &f{message}'
    spy: '&8[&cSPY&8] &7[{router}&7] &e{sender} &8-> &e{target}&8: &f{message}'
  self: '{prefix}&cNo puedes enviarte mensajes privados a ti mismo.'
  target-disabled: '{prefix}&cEl jugador &e{target} &ctiene los mensajes privados desactivados.'
  toggled-on: '{prefix}&7Mensajes privados &aactivados&7.'
  toggled-off: '{prefix}&7Mensajes privados &cdesactivados&7.'
  spy-on: '{prefix}&7SocialSpy &aactivado&7.'
  spy-off: '{prefix}&7SocialSpy &cdesactivado&7.'
  no-reply: '{prefix}&cNo tienes a nadie a quien responder.'
  reply-offline: '{prefix}&cEl jugador con el que hablabas ya no está conectado en este servidor.'
  usage: '{prefix}&cUso correcto: /{command} <jugador> <mensaje>'
  usage-reply: '{prefix}&cUso correcto: /{command} <mensaje>'
  disabled: '{prefix}&cEl sistema de mensajería privada está desactivado.'

staffchat:
  format: '&b&lSC&8 &8(&7{server}&8) &7{player}&8 » &f{message}'
  toggled-on: '{prefix}&7StaffChat &aactivado&7.'
  toggled-off: '{prefix}&7StaffChat &cdesactivado&7.'

filter:
  flood: '{prefix}&cEstás escribiendo demasiado rápido, espera &e{time}s&c.'
  repeat: '{prefix}&cNo repitas el mismo mensaje.'
  advertising: '{prefix}&cNo está permitido enviar IPs ni enlaces.'
  caps: '{prefix}&7Por favor, no abuses de las mayúsculas.'
  notify:
    format: '&8[&cFiltro&8] &7[{router}&7] &e{player} &8(&7{server}&8) &7{action} por &c{check}&8: &f{message}'
    blocked: '&cbloqueado'
    modified: '&emodificado'

aps-blocked: '&cUnknown command (/{command}).'

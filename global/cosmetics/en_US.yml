  no-recent-loot: None
commands:
  menu:
    help: '&7 /gmenu menu <category> - &eOpens the menu of a category.'
  equip:
    help: '&7 /gmenu equip [category] [cosmetic] <player> - &eEquips a cosmetic.'
    usage: '{prefix}&cUsage: &e/gmenu equip [category] [cosmetic] <player>'
  reset:
    help: '&7 /gmenu reset <all|category> <player|all> <msg=false> - &eRemoves cosmetics.'

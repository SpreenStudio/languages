# Cosmetics (FurryCore module): English texts of the 'cosmetics' section.
# Placeholders between braces ({player}, {item}, {mysteryDust}...). Menu YAMLs use the keys as
# [lang=cosmetics]<key>.

prefix: '&d&lCosmetics &8» '
general:
  enabled: '&aEnabled'
  disabled: '&cDisabled'
  time:
    second: second
    seconds: seconds
    minute: minute
    minutes: minutes
    hour: hour
    hours: hours
    day: day
    days: days
  rarity:
    common: '&e&lCOMMON'
    rare: '&9&lRARE'
    epic: '&5&lEPIC'
    legendary: '&d&lLEGENDARY'
  categories:
    hats: '&bHat'
    animated-hats: '&bAnimated Hat'
    particles: '&bParticle'
    suits: '&bSuit'
    gadgets: '&bGadget'
    pets: '&bPet'
    miniatures: '&bMiniature'
    morphs: '&bMorph'
    banners: '&bBanner'
    emotes: '&bEmote'
    cloaks: '&bCloak'
  cooldown:
    remain: '&7■'
    retain: '&b■'
    message: '&f{name} &b{cooldownBlock} &a{timeLeft}s'

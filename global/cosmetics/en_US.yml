    help: '&7 /gmenu addpermission [player] [category] [cosmetic] - &eUnlocks a cosmetic.'
    usage: '{prefix}&cUsage: &e/gmenu addpermission [player] [category] [cosmetic]'
  removepermission:
    help: '&7 /gmenu removepermission [player] [category] [cosmetic] - &eLocks a cosmetic.'
    usage: '{prefix}&cUsage: &e/gmenu removepermission [player] [category] [cosmetic]'
  permission:
    help: '&7 /gmenu permission [category|commands] <page> - &eLists the permissions.'
    usage: '{prefix}&cUsage: &e/gmenu permission [category|commands] <page>'
    header: '{prefix}&fPermissions &7● &e{page}/{pages}'
    line: '&7 - &e{permission}'
  petitems:
    help: |-
      &7 /gmenu petitems add|remove|set [item|all] [player] [amount] - &eManages pet items.
      &7 /gmenu petitems check [player] - &eShows the pet items.
    usage: '{prefix}&cUsage: &e/gmenu petitems add|remove|set [item|all] [player] [amount] &7| &e/gmenu petitems check [player]'
    header: '{prefix}&fPet items of &b{player}'
    line: '&7 - {petItem}&7: &e{amount}'
    all: All
  namepet:
    help: |-
      &7 /gmenu namepet [name] - &eNames your pet.
      &7 /gmenu namepet [player] [pet] [name|reset] - &eNames the pet of another player.
    usage: '{prefix}&cUsage: &e/gmenu namepet [name] &7| &e/gmenu namepet [player] [pet] [name|reset]'
  menuitem:
    help: '&7 /gmenu menuitem <player> - &eGives the cosmetics menu item.'
  settings:
    help: '&7 /gmenu settings [bypasscooldown|selfmorphview] [true|false] - &eChanges your settings.'
  status:
    help: '&7 /gmenu status [player] - &eShows the data of a player.'
    usage: '{prefix}&cUsage: &e/gmenu status [player]'
    info: |-
      {prefix}&fStatus of &b{player}
      &7 UUID: &e{uuid}
      &7 Mystery dust: &e{mysteryDust}
      &7 Mystery boxes: &e{mysteryBoxes}
      &7 Gift packs: &e{giftPacks}
      &7 Gifts sent: &e{giftSent} &8· &7Received: &e{giftReceived}
      &7 Equipped cosmetics: &e{equipped}
      &7 Unlocked cosmetics: &e{unlocked}
  reload:
    help: '&7 /gmenu reload - &eReloads the module.'
  about:
    help: '&7 /gmenu about - &eAbout the module.'
    info: '{prefix}&fCosmetics &ev{version}&f, FurryCore module with &b{cosmetics} &fcosmetics.'
  dust-add:
    help: '&7 /mysterydust add [player|all] [amount] - &eGives mystery dust.'
    usage: '{prefix}&cUsage: &e/mysterydust add [player|all] [amount]'
  dust-remove:
    help: '&7 /mysterydust remove [player] [amount] - &eTakes mystery dust.'
    usage: '{prefix}&cUsage: &e/mysterydust remove [player] [amount]'
  dust-set:
    help: '&7 /mysterydust set [player] [amount] - &eSets the mystery dust.'
    usage: '{prefix}&cUsage: &e/mysterydust set [player] [amount]'

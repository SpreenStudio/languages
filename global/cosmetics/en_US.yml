    help: '&7 /mysterydust pay [player] [amount] - &eSends mystery dust.'
    usage: '{prefix}&cUsage: &e/mysterydust pay [player] [amount]'
  boxes-give:
    help: '&7 /gmb give [player|all] [quality] <amount> <days> - &eGives mystery boxes.'
    usage: '{prefix}&cUsage: &e/gmb give [player|all] [quality 1-5] <amount> <days>'
  boxes-giveall:
    help: '&7 /gmb giveall [quality] <amount> <days> - &eGives boxes to everyone online.'
    usage: '{prefix}&cUsage: &e/gmb giveall [quality 1-5] <amount> <days>'
  boxes-check:
    help: '&7 /gmb check <player> - &eShows the boxes of a player.'
    usage: '{prefix}&cUsage: &e/gmb check [player]'
  boxes-gift:
    help: '&7 /gmb gift [player] [amount] - &eGives gift packs.'
    usage: '{prefix}&cUsage: &e/gmb gift [player] [amount]'
  boxes-vault:
    help: |-
      &7 /gmb vault create|move [name] - &eCreates or moves a vault to the block you look at.
      &7 /gmb vault remove|tp [name] - &eRemoves a vault or takes you to it.
      &7 /gmb vault list - &eLists the mystery vaults.
    usage: '{prefix}&cUsage: &e/gmb vault create|remove|move|tp [name] &7| &e/gmb vault list'

# Cosmetics (modulo de FurryCore): textos en espanol de la seccion 'cosmetics'.
# Variables entre llaves ({player}, {item}, {mysteryDust}...). Los YAML de los menus usan las claves como
# [lang=cosmetics]<clave>.

prefix: '&d&lCosméticos &8» '
general:
  enabled: '&aActivado'
  disabled: '&cDesactivado'
  time:
    second: segundo
    seconds: segundos
    minute: minuto
    minutes: minutos
    hour: hora
    hours: horas
    day: día
    days: días
  rarity:
    common: '&e&lCOMÚN'
    rare: '&9&lRARO'
    epic: '&5&lÉPICO'
    legendary: '&d&lLEGENDARIO'
  categories:
    hats: '&bCabeza'
    animated-hats: '&bCabeza Animada'
    particles: '&bPartícula'
    suits: '&bTraje'
    gadgets: '&bArtefacto'
    pets: '&bMascota'
    miniatures: '&bMiniatura'
    morphs: '&bTransformación'
    banners: '&bBandera'
    emotes: '&bEmoticón'
    cloaks: '&bPartícula Especial'
  cooldown:
    remain: '&7■'
    retain: '&b■'
    message: '&f{name} &b{cooldownBlock} &a{timeLeft}s'
  loading: '&cCargando...'
  none: Ninguno
  no-recent-loot: Ninguno
commands:
  menu:
    help: '&7 /gmenu menu <categoría> - &eAbre el menú de una categoría.'
  equip:
    help: '&7 /gmenu equip [categoría] [cosmético] <jugador> - &eEquipa un cosmético.'
    usage: '{prefix}&cUso: &e/gmenu equip [categoría] [cosmético] <jugador>'
  reset:
    help: '&7 /gmenu reset <all|categoría> <jugador|all> <msg=false> - &eQuita los cosméticos.'
  addpermission:
    help: '&7 /gmenu addpermission [jugador] [categoría] [cosmético] - &eDesbloquea un cosmético.'
    usage: '{prefix}&cUso: &e/gmenu addpermission [jugador] [categoría] [cosmético]'
  removepermission:
    help: '&7 /gmenu removepermission [jugador] [categoría] [cosmético] - &eBloquea un cosmético.'
    usage: '{prefix}&cUso: &e/gmenu removepermission [jugador] [categoría] [cosmético]'
  permission:
    help: '&7 /gmenu permission [categoría|commands] <página> - &eLista los permisos.'
    usage: '{prefix}&cUso: &e/gmenu permission [categoría|commands] <página>'
    header: '{prefix}&fPermisos &7● &e{page}/{pages}'
    line: '&7 - &e{permission}'
  petitems:
    help: |-
      &7 /gmenu petitems add|remove|set [objeto|all] [jugador] [cantidad] - &eGestiona los objetos de mascota.
      &7 /gmenu petitems check [jugador] - &eMuestra los objetos de mascota.
    usage: '{prefix}&cUso: &e/gmenu petitems add|remove|set [objeto|all] [jugador] [cantidad] &7| &e/gmenu petitems check [jugador]'
    header: '{prefix}&fObjetos de mascota de &b{player}'
    line: '&7 - {petItem}&7: &e{amount}'
    all: Todos
  namepet:
    help: |-
      &7 /gmenu namepet [nombre] - &ePon nombre a tu mascota.
      &7 /gmenu namepet [jugador] [mascota] [nombre|reset] - &eCambia el nombre de la mascota de otro.
    usage: '{prefix}&cUso: &e/gmenu namepet [nombre] &7| &e/gmenu namepet [jugador] [mascota] [nombre|reset]'
  menuitem:
    help: '&7 /gmenu menuitem <jugador> - &eDa el objeto del menú de cosméticos.'
  settings:
    help: '&7 /gmenu settings [bypasscooldown|selfmorphview] [true|false] - &eCambia tus ajustes.'
  status:
    help: '&7 /gmenu status [jugador] - &eMuestra los datos de un jugador.'
    usage: '{prefix}&cUso: &e/gmenu status [jugador]'
    info: |-
      {prefix}&fEstado de &b{player}
      &7 UUID: &e{uuid}
      &7 Polvo misterioso: &e{mysteryDust}
      &7 Cajas misteriosas: &e{mysteryBoxes}
      &7 Packs de regalo: &e{giftPacks}
      &7 Regalos enviados: &e{giftSent} &8· &7Recibidos: &e{giftReceived}
      &7 Cosméticos equipados: &e{equipped}
      &7 Cosméticos desbloqueados: &e{unlocked}
  reload:
    help: '&7 /gmenu reload - &eRecarga el módulo.'
  about:
    help: '&7 /gmenu about - &eInformación del módulo.'
    info: '{prefix}&fCosmetics &ev{version}&f, módulo de FurryCore con &b{cosmetics} &fcosméticos.'
  dust-add:
    help: '&7 /mysterydust add [jugador|all] [cantidad] - &eDa polvo misterioso.'
    usage: '{prefix}&cUso: &e/mysterydust add [jugador|all] [cantidad]'
  dust-remove:
    help: '&7 /mysterydust remove [jugador] [cantidad] - &eQuita polvo misterioso.'
    usage: '{prefix}&cUso: &e/mysterydust remove [jugador] [cantidad]'
  dust-set:
    help: '&7 /mysterydust set [jugador] [cantidad] - &eEstablece el polvo misterioso.'
    usage: '{prefix}&cUso: &e/mysterydust set [jugador] [cantidad]'
  dust-check:
    help: '&7 /mysterydust check <jugador> - &eMuestra el polvo misterioso.'
    usage: '{prefix}&cUso: &e/mysterydust check [jugador]'
  dust-pay:
    help: '&7 /mysterydust pay [jugador] [cantidad] - &eEnvía polvo misterioso.'
    usage: '{prefix}&cUso: &e/mysterydust pay [jugador] [cantidad]'
  boxes-give:
    help: '&7 /gmb give [jugador|all] [calidad] <cantidad> <días> - &eDa cajas misteriosas.'
    usage: '{prefix}&cUso: &e/gmb give [jugador|all] [calidad 1-5] <cantidad> <días>'
  boxes-giveall:
    help: '&7 /gmb giveall [calidad] <cantidad> <días> - &eDa cajas a todos los conectados.'
    usage: '{prefix}&cUso: &e/gmb giveall [calidad 1-5] <cantidad> <días>'
  boxes-check:
    help: '&7 /gmb check <jugador> - &eMuestra las cajas de un jugador.'
    usage: '{prefix}&cUso: &e/gmb check [jugador]'
  boxes-gift:
    help: '&7 /gmb gift [jugador] [cantidad] - &eDa packs de regalo.'
    usage: '{prefix}&cUso: &e/gmb gift [jugador] [cantidad]'
  boxes-vault:
    help: |-
      &7 /gmb vault create|move [nombre] - &eCrea o mueve una máquina al bloque que miras.
      &7 /gmb vault remove|tp [nombre] - &eBorra una máquina o te lleva a ella.
      &7 /gmb vault list - &eLista las máquinas de cajas.
    usage: '{prefix}&cUso: &e/gmb vault create|remove|move|tp [nombre] &7| &e/gmb vault list'
    line: '&7 - &b{name} &7({world}: {x}, {y}, {z})'

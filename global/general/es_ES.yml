commands:
  help: |-
    {center}{prefix}&fAyuda &7● &e<opcional> / [requerido]
    &7
    {commands}
    &7
  setlobby:
    help: '&7 /core setlobby - &eEstablece el spawnpoint del lobby.'
    success: '{prefix}&a¡Spawnpoint del lobby establecido!'
  lang:
    help: |-
      &7 /core lang get <jugador> - &eObtén el idioma.
      &7 /core lang set [idioma] <jugador> - &eEstablece el idioma.
      &7 /core lang reset <jugador> - &eRestablece el idioma predeterminado.
      &7 /core lang reload <local> - &eRecarga los archivos de idioma.
    reload: '{prefix}&a¡Los archivos de idioma han sido recargados!'
    reloadLocal: '{prefix}&a¡Los archivos de idioma locales han sido recargados!'
    get: '{prefix}&fTu idioma es &e{lang}&f.'
    get_other: '{prefix}&fEl idioma de &b{player} &fes &e{lang}&f.'
    set: '{prefix}&f¡Tu idioma cambió a &e{lang}&f!'
    reset: '{prefix}&f¡Tu idioma fue restablecido a &e{lang}&f!'
    reset_other: '{prefix}&f¡El idioma de &b{player} &ffue restablecido a &e{lang}&f!'
    set_other: '{prefix}&f¡El idioma de &b{player} &fha sido cambiado a &e{lang}&f!'
  reload:
    help: |-
      &7 /core reload - &eRecarga todos los archivos.
      &7 /core reload local - &eRecarga solamente los archivos locales.
    success: '{prefix}&a¡Todos los archivos han sido recargados!'
    local: '{prefix}&a¡Los archivos locales han sido recargados!'
  jumppads:
    help: |-
      &7 /core jumppads material [material] - &eEstablece el material del jumppad.
      &7 /core jumppads height [multiplicador] - &eEstablece la altura del jumppad.
      &7 /core jumppads length [multiplicador] - &eEstablece la fuerza del jumppad.
      &7 /core jumppads sound [sonido] - &eEstablece el sonido del jumppad.
    invalidMaterial: '{prefix}&cEse material no existe.'
    invalidNumber: '{prefix}&c¡Ese no es un número válido para los ajustes!'
    invalidSound: '{prefix}&c¡Ese no es un sonido válido para los ajustes!'
    material: '{prefix}&aEstableciste el material del jumppad a &e%s&a.'
    height: '{prefix}&aEstableciste la altura del jumppad a &e%s&a.'
    length: '{prefix}&aEstableciste la fuerza del jumppad a &e%s&a.'
    sound: '{prefix}&aEstableciste el sonido del jumppad a &e%s&a.'
  worlds:
    help: |-
      &7 /core worlds add [mundo] - &eAñade un mundo a la lista.
      &7 /core worlds remove [mundo] - &eQuita un mundo de la lista.
      &7 /core worlds toggle [mundo] [módulo] - &eAlterna un módulo en un mundo.
      &7 /core worlds reset [mundo] - &eActiva todos los módulos de un mundo.
    modes:
      whitelist: 'protegidos'
      blacklist: 'bloqueados'
    notExist: '{prefix}&c¡Ese mundo no existe!'
    alreadyAdded: '{prefix}&cEse mundo ya está en la lista.'
    notAdded: '{prefix}&cEse mundo no está en la lista.'
    added: '{prefix}&aHas añadido el mundo &e%s&a a los mundos %s.'
    removed: '{prefix}&aEliminaste el mundo &e%s&a de los mundos %s.'
    reset: '{prefix}&aHas restablecido los módulos del mundo &e%s&a.'
    noModule: '{prefix}&cDebes especificar el módulo que quieres alternar. Haz Tab para conocer los módulos disponibles.'
    invalidModule: '{prefix}&c¡Ese módulo no existe!'
    moduleEnabled: '{prefix}&aHas &eactivado&a el módulo &b%s&a.'
    moduleDisabled: '{prefix}&aHas &edesactivado&a el módulo &b%s&a.'
  easterEggs:
    help: |-
      &7 /core easterEggs addEasterEgg - &eAñade un easter egg en tu ubicación.
      &7 /core easterEggs removeEasterEgg - &eQuita el easter egg de tu ubicación.
      &7 /core easterEggs clear [jugador] - &eReinicia los easter eggs encontrados por un jugador.
    disabled: '{prefix}&cLos easter eggs están deshabilitados.'
    clearUsage: '{prefix}&cUso: &e/core easterEggs clear [jugador]'
    offline: '{prefix}&cEl jugador &e%s &cse encuentra desconectado.'
  open:
    help: '&7 /core open [menú] <jugador> - &eAbre un menú del core.'
  fly:
    activated: '{prefix}&7Tu modo de vuelo ha sido &aactivado&7.'
    deactivated: '{prefix}&7Tu modo de vuelo ha sido &cdesactivado&7.'
    notAllowed: '{prefix}&cNo puedes usar ese comando en este mundo.'
    all: '{prefix}&7Has alternado el modo de vuelo de &etodos&7.'
    other:
      activated: '{prefix}&7Has &aactivado&7 el modo de vuelo de &e%s&7.'
      deactivated: '{prefix}&7Has &cdesactivado&7 el modo de vuelo de &e%s&7.'
  gamemode:
    usage: '{prefix}&7Uso: &e/gamemode [modo] <jugador|all>'
    modes:
      CREATIVE: 'Creativo'
      SURVIVAL: 'Supervivencia'
      ADVENTURE: 'Aventura'
      SPECTATOR: 'Espectador'
    success:
      self: '{prefix}&7Tu modo de juego ha cambiado a &a{mode}&7.'
      other: '{prefix}&7Has cambiado el modo de juego de &e{player}&7 a &a{mode}&7.'
      all: '{prefix}&7Has cambiado el modo de juego de &etodos&7 a &a{mode}&7.'
  coins:
    help: |-
      &7 /core money add <jugador> [cantidad] - &eAñade monedas.
      &7 /core money remove <jugador> [cantidad] - &eQuita monedas.
      &7 /core money set <jugador> [cantidad] - &eEstablece el balance.
    give:
      self: '{prefix}&7¡&e%s &7monedas agregadas a tu balance!'
      other: '{prefix}&7Añadiste &e%s&7 monedas al balance de &b%s&7.'
    get:
      self: '{prefix}&7Tu balance es de &e%s &7monedas.'
      other: '{prefix}&7El balance de &b%s&7 es de &e%s &7monedas.'
    remove:
      self: '{prefix}&7¡&e%s &7monedas han sido retiradas de tu balance!'
      other: '{prefix}&7Se han retirado &e%s&7 monedas del balance de &b%s&7.'
    set:
      self: '{prefix}&7¡Tu balance ahora es de &e%s &7monedas!'
      other: '{prefix}&7Estableciste en &e%s&7 monedas el balance de &b%s&7.'
  nick:
    help: |-
      &c /nick &8- &7Abre el menú para cambiar de nick.
      &c /nick [nombre] &8- &7Cambia a un nick específico.
      &c /nick clear &8- &7Quita tu nick actual.
    notNicked: '{prefix}&cNo estás usando un nick en este momento.'
    setNick: '{prefix}&7Tu nick ha sido establecido en: &e%s&7.'
    clear: '{prefix}&cHas quitado tu nick y vuelves a ser tú.'
    isNicked: '{prefix}&cYa estás disfrazado actualmente.'
    invalidNick: '{prefix}&cEl nick proporcionado no cumple con los requisitos. (Entre 3 y 16 caracteres, letras, números o guiones)'
  speed:
    help: |-
      &7 /speed help &8- &7Muestra esta ayuda.
      &7 /speed reset <jugador> &8- &7Restablece tu velocidad (o la de otro) a la predeterminada.
      &7 /speed [0-10] <jugador> &8- &7Cambia tu velocidad (o la de otro).
    reset: '{prefix}&aTu velocidad ha sido restablecida a la predeterminada.'
    resetOther: '{prefix}&7Restableciste la velocidad de &b%s&7.'
    invalidSpeed: '{prefix}&cPor favor, ingresa una cantidad de velocidad válida.'
    setSpeedOther: '{prefix}&7Cambiaste la velocidad a &e%s&7 de &b%s&7.'
    setFlySpeed: '{prefix}&7Tu velocidad de &evuelo &7ha sido cambiada a &b%s&7.'
    setWalkSpeed: '{prefix}&7Tu velocidad de &ecaminado &7ha sido cambiada a &b%s&7.'
  warp:
    notFound: '{prefix}&cEse warp no existe.'
    help: |-
      &7 /warp - &eMuestra la lista de warps disponibles.
      &7 /warp [warp] - &eTeletranspórtate a un warp.
    tp: '{prefix}&7Has sido teletransportado a &e{warp}&7.'
  setwarp:
    help: '&7 /setwarp [warp] - &eGuarda un nuevo warp.'
    alreadyExists: '{prefix}&cEse warp ya existe.'
    success: '{prefix}&7Warp &e{warp}&7 guardado correctamente.'
  delwarp:
    help: '&7 /delwarp [warp] - &eElimina un warp existente.'
    success: '{prefix}&7Warp &e{warp}&7 eliminado correctamente.'


# Abilities (abilities.yml).
abilities:
  adrenaline-boost:
    name: '&aAdrenaline boost'
    desc: |-
      &f When you get hurt you can
      &f get a speed boost.
    levels-desc: |-
      &f You have a &e%chance%% &fchance to get
      &f speed when you get hurt.
  aggressive-mode:
    name: '&aAggressive mode'
    desc: |-
      &f Deal more damage when you have
      &f less than 5 hearts left.
    levels-desc: |-
      &f With less than 5 hearts you deal
      &e %value%% &fmore damage &e%chance%% &fof the time.
  arrow-tank:
    name: '&aArrow tank skin'
    desc: '&f Take less damage from arrows.'
    levels-desc: |-
      &f You have a &e%chance%% &fchance to take
      &e %value%% &fless damage from projectiles.
  feather-weight:
    name: '&aFeather weight'
    desc: '&f Take less fall damage.'
    levels-desc: |-
      &f Take &e%value%% &fless fall damage
      &e %chance%% &fof the time.
  fire-resistance:
    name: '&aFire resistance'
    desc: '&f Take less damage from fire.'
    levels-desc: |-
      &f Take &e%value%% &fless damage from fire and lava
      &e %chance%% &fof the time.
  menu:
    item:
      level: 'level %number%'
    lore:
      clickto:
        disable: '&e Click to disable it.'
        enable: '&e Click to enable it.'
      disabled: '&8&lDISABLED'
      price: '&f Price: &b%price% points'
      status:
        afford: '&c You do not have enough points!'
        disabled: '&e Click the icon on the left to enable it.'
        purchase: '&e Click to buy this upgrade.'
        purchased: '&a You already have it!'
        unavailable: '&c You cannot buy this yet!'
  mining-luck:
    name: '&aMining luck'
    desc: |-
      &f Improve your mining skill to
      &f get more out of every ore.
    levels-desc: |-
      &f You have a &e%chance%% &fchance to get
      &e %value% &fresources when mining an ore.
  pirate:
    name: '&aPirate'
    desc: '&f Find treasures hidden in the dirt.'
    levels-desc: '&f Find treasures in &e%chance%% &fof the dirt.'
  triple-arrow:
    name: '&aTriple arrow shot'
    desc: '&f Shoot 3 arrows at once.'
    levels-desc: |-
      &f You have a &e%chance%% &fchance to shoot
      &f 3 arrows at once.
  woodchopping-luck:
    name: '&aWoodchopping luck'
    desc: |-
      &f Improve your woodchopping skill to
      &f get more logs out of every one.
    levels-desc: '&f You have a &e%chance%% &fchance to get &e%value% &flogs.'
  vampire:
    name: '&aVampirism'
    desc: |-
      &f Heal with the melee
      &f damage you deal.
    levels-desc: |-
      &f You have a &e%chance%% &fchance to heal
      &e %value%% &fof the damage you deal.
  blast-protection:
    name: '&aBlast proof'
    desc: '&f Take less damage from explosions.'
    levels-desc: |-
      &f Take &e%value%% &fless damage from explosions
      &e %chance%% &fof the time.
  golden-kill:
    name: '&aGolden loot'
    desc: |-
      &f Get golden apples
      &f when you kill.
    levels-desc: |-
      &f You have a &e%chance%% &fchance to get

# Admin commands and editors.
admin:
  boxes:
    zone:
      solo: '&b&lSOLO'
      team: '&d&lTEAM'
    # %s: cage
    opened: '{prefix}&7Creating the cage &e%s&7.'
    opened-edit: '{prefix}&7Editing the cage &e%s&7.'
    guide: |-
      &7
      &f Build it in its two zones:
      &b  SOLO &7- room for one player.
      &d  TEAM &7- a 3x3 space for the team.
      &7
      &f The &agreen &fblocks below are where the players
      &f stand: they need a floor on top and 2 free
      &f blocks. The gray area is what gets saved.
      &7
      &e Compass&f: switch zone. &aEmerald&f: save.
      &7 /boxes cancel &fto leave without saving.
      &7
    # %s: zone
    zone-teleport: '{prefix}&7Zone %s&7.'
    saved: '{prefix}&aCage &e%s &asaved! &7It is now in the cages menu.'
    cancelled: '{prefix}&7The cage &e%s &7was discarded.'
    error:
      # %s: zone
      empty: '{prefix}&cThe %s &czone is empty.'
      no-floor: '{prefix}&cThe %s &czone needs a floor on top of the green blocks.'
      no-space: '{prefix}&cThe players do not fit in the %s &czone: leave 2 free blocks above the green floor.'
    tools:
      switch:
        name: '&eSwitch zone &7(Click)'
        lore: |-
          &7
          &f Takes you to the other version
          &f of the cage (SOLO or TEAM).
          &7
      save:
        name: '&aSave the cage &7(Click)'
        lore: |-
          &7
          &f Saves both versions and takes
          &f you back where you were.
          &7
          &7 /boxes cancel &fto discard it.
          &7
    usage-create: '{prefix}&cUsage: &e/boxes create <name>'
    usage-edit: '{prefix}&cUsage: &e/boxes edit <name>'
    invalid-name: '{prefix}&cThe name can only have letters, numbers, - and _.'
    # %s: cage
    exists: '{prefix}&cThere is already a cage called &e%s&c.'
    not-found: '{prefix}&cThere is no cage called &e%s&c.'
    already-creating: '{prefix}&cYou are already working on the cage &e%s&c: save it or cancel it.'
    # %s: player
    busy: '{prefix}&e%s &cis using the cage creator.'
    not-creating: '{prefix}&cYou are not creating any cage!'
    unknown: '{prefix}&cThat subcommand does not exist. Use &e/boxes&c.'
    # %s: cages
    list: '{prefix}&7Cages: &e%s'
    help:
      header: |-
        &7
        {prefix}&fHelp &7● &eCages
        &7
      create: '&7 /boxes create <name> - &eCreates a new cage (SOLO and TEAM).'
      edit: '&7 /boxes edit <name> - &eEdits a cage.'
      zone: '&7 /boxes solo|team - &eTakes you to one of its two zones.'
      save: '&7 /boxes save - &eSaves the cage you are making.'
      cancel: '&7 /boxes cancel - &eLeaves without saving.'
      list: '&7 /boxes list - &eShows the cages.'
  editor:
    # %s: arena (the title cannot be longer than 32 characters)
    title: '&8&lS&7&lS&0 » %s'
    spawns-title: '&8&lS&7&lS&0 » Spawns'
    balloon-spawns-title: '&8&lS&7&lS&0 » Balloon Spawns'
    no-spawns: '&cThere are no spawns registered!'
    no-balloon-spawns: '&cThere are no balloon spawns registered!'
    click-block: '{prefix}&cYou must click a block!'
    # %s: arena
    enabled: '{prefix}&e%s &awas reloaded and can be played now.'
    disabled: '{prefix}&e%s &7is disabled: you can edit it now.'
    disable-first: '{prefix}&cYou must disable the arena first!'
    negative-players: '{prefix}&cYou cannot set negative players!'
    min-team-size: '{prefix}&cThe minimum team size is 1 (SOLO).'
    # %s: mode, team size, max players
    team-size: '{prefix}&7Mode &e%s&7, teams of &e%s&7. Max: &e%s &7players.'
    map-saved: '{prefix}&7The map of &e%s &7was saved in the &emaps &7folder.'
    rename:
      title: '&a&lArena name'
      subtitle: '&7Type the new name in the chat'
      actionbar: '&fCurrent: &r%s'
      # %s: arena, new name
      done: '{prefix}&7Display name of &e%s&7: &r%s'
    # Editor buttons (/sw arena edit). In texts with several values: %1$s, %2$s...
    items:
      back:
        name: '&b« &eBack'
        lore: |-
          &7
          &f Goes back to the previous menu.
          &7
      spawn-point:
        lore: |-
          &7
          &f Arena: &r%s
          &7
          &e Left click to delete.
          &e Right click to go there.
          &7
      display-name:
        name: '&7» &bDisplay name'
        lore: |-
          &7
          &f Change the name the
          &f players will see.
          &7
          &f Current: &r%s
          &7
          &e Click to change it.
      save-map:
        name: '&7» &bSave the map'
        lore: |-
          &7
          &f Saves and replaces the
          &f map of the arena.
          &7
      enable:
        name: '&7» &aEnable arena'
        lore: |-
          &7
          &f Changes the arena mode
          &f so it can be played.
          &7
          &f Status: &cDisabled&f.
          &7
          &e Click to change it.
      disable:
        name: '&7» &cDisable arena'
        lore: |-
          &7
          &f Changes the arena mode
          &f so it can be edited.
          &7
          &f Status: &aEnabled&f.
          &7
          &e Click to change it.
      min-players:
        name: '&7» &bMinimum players'
        lore: |-
          &7
          &f Changes the minimum
          &f number of players.
          &7
          &f Current: &e%s
          &7
          &e Left click to increase.
          &e Right click to decrease.
      team-size:
        name: '&7» &bMode and team size'
        lore: |-
          &7
          &f Every spawn point is a team.
          &f Size 1 = SOLO, 2 or more = TEAM.
          &7
          &f Mode: &e%1$s
          &f Team size: &e%2$s
          &f Max players: &e%3$s
          &7
          &e Left click to increase.
          &e Right click to decrease.
      checklist:
        name: '&7» &bWhat is missing'
        lore: |-
          &7
          &f To enable the arena everything
          &f must be &a✔&f.
          &7
      spectators:
        name: '&7» &bSpectator spawn'
        lore: |-
          &7
          &f Where spectators appear.
          &f It is also the center of the map:
          &f the cages face it.
          &7
          &f Status: %s
          &7
          &e Click to go there.
      lobby:
        name: '&7» &bWaiting lobby'
        lore: |-
          &7
          &f Where players wait as they join.
          &f With &e%2$s &fseconds left they go
          &f to their cages. Required in TEAM.
          &7
          &f Status: %1$s
          &7
          &e Left click: set it where you stand.
          &e Right click: remove it.
          &e Shift + click: go there.
      spawns:
        name: '&7» &bSpawn points'
        lore: |-
          &7
          &f Each one is a team, with its
          &f cage (3x3 in TEAM).
          &7
          &f Spawns: &e%s
          &7
          &e Click to see them.
      balloon-spawns:
        name: '&7» &bBalloon spawn points'
        lore: |-
          &7
          &f Change the balloon
          &f spawn points.
          &7

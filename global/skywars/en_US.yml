# ------------------------------------------------------------------
#  SkyWars · English (FurryCore language section 'skywars')
#  Colours with '&'. {prefix} is replaced by 'prefix'.
#  '%s' are values filled in by the plugin, in order; keep them.
#  The plugin's YAML files (menus, items, scoreboard...) use them as
#  %core_skywars_<key>%. A list takes several lines in an item.
#  A 'null' value disables the message.
# ------------------------------------------------------------------

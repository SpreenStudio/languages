# ------------------------------------------------------------------
#  SkyWars · Español (sección 'skywars' de los idiomas de FurryCore)
#  Colores con '&'. {prefix} se sustituye por 'prefix'.
#  Los '%s' son valores que pone el plugin, en orden; no los quites.
#  En los YAML del plugin (menús, ítems, marcador...) se usan como
#  %core_skywars_<clave>%. Una lista ocupa varias líneas en un ítem.
#  Un valor 'null' desactiva el mensaje.
# ------------------------------------------------------------------

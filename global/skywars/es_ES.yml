    zone:
      solo: '&b&lSOLO'
      team: '&d&lTEAM'
    # %s: caja
    opened: '{prefix}&7Creando la caja &e%s&7.'
    opened-edit: '{prefix}&7Editando la caja &e%s&7.'
    guide: |-
      &7
      &f Constrúyela en sus dos zonas:
      &b  SOLO &7- sitio para un jugador.
      &d  TEAM &7- hueco de 3x3 para el equipo.
      &7
      &f Los bloques &averdes &fde abajo son donde están
      &f los jugadores: tienen que tener suelo encima y
      &f 2 bloques libres. Lo gris es hasta dónde se guarda.
      &7
      &e Brújula&f: cambiar de zona. &aEsmeralda&f: guardar.
      &7 /boxes cancel &fpara salir sin guardar.
      &7
    # %s: zona
    zone-teleport: '{prefix}&7Zona %s&7.'
    saved: '{prefix}&a¡Caja &e%s &aguardada! &7Ya sale en el menú de cajas.'
    cancelled: '{prefix}&7Se descartó la caja &e%s&7.'
    error:
      # %s: zona
      empty: '{prefix}&cLa zona %s &cestá vacía.'
      no-floor: '{prefix}&cA la zona %s &cle falta suelo encima de los bloques verdes.'
      no-space: '{prefix}&cEn la zona %s &cno caben los jugadores: deja 2 bloques libres encima del suelo verde.'
    tools:
      switch:
        name: '&eCambiar de zona &7(Clic)'
        lore: |-
          &7
          &f Te lleva a la otra versión
          &f de la caja (SOLO o TEAM).
          &7
      save:
        name: '&aGuardar la caja &7(Clic)'
        lore: |-
          &7
          &f Guarda las dos versiones
          &f y vuelve a donde estabas.
          &7
          &7 /boxes cancel &fpara descartarla.
          &7
    usage-create: '{prefix}&cUso: &e/boxes create <nombre>'
    usage-edit: '{prefix}&cUso: &e/boxes edit <nombre>'
    invalid-name: '{prefix}&cEl nombre solo puede tener letras, números, - y _.'
    # %s: caja
    exists: '{prefix}&cYa hay una caja llamada &e%s&c.'
    not-found: '{prefix}&cNo hay ninguna caja llamada &e%s&c.'
    already-creating: '{prefix}&cYa estás con la caja &e%s&c: guárdala o cancélala.'
    # %s: jugador
    busy: '{prefix}&e%s &cestá usando el creador de cajas.'
    not-creating: '{prefix}&c¡No estás creando ninguna caja!'
    unknown: '{prefix}&cEse subcomando no existe. Usa &e/boxes&c.'
    # %s: cajas
    list: '{prefix}&7Cajas: &e%s'
    help:
      header: |-
        &7
        {prefix}&fAyuda &7● &eCajas
        &7
      create: '&7 /boxes create <nombre> - &eCrea una caja nueva (SOLO y TEAM).'
      edit: '&7 /boxes edit <nombre> - &eEdita una caja.'
      zone: '&7 /boxes solo|team - &eTe lleva a una de sus dos zonas.'
      save: '&7 /boxes save - &eGuarda la caja que estás haciendo.'
      cancel: '&7 /boxes cancel - &eSale sin guardar.'
      list: '&7 /boxes list - &eMuestra las cajas.'
  editor:
    # %s: arena (el título no puede pasar de 32 caracteres)
    title: '&8&lS&7&lS&0 » %s'
    spawns-title: '&8&lS&7&lS&0 » Spawns'
    balloon-spawns-title: '&8&lS&7&lS&0 » Spawns de globos'
    no-spawns: '&c¡No hay spawns registrados!'
    no-balloon-spawns: '&c¡No hay spawns de globos registrados!'
    click-block: '{prefix}&c¡Debes hacer clic en un bloque!'
    # %s: arena
    enabled: '{prefix}&e%s &ase ha recargado y ya se puede jugar.'
    disabled: '{prefix}&e%s &7está desactivada: ya puedes editarla.'
    disable-first: '{prefix}&c¡Primero debes desactivar la arena!'
    negative-players: '{prefix}&c¡No puedes poner jugadores negativos!'
    min-team-size: '{prefix}&cEl tamaño mínimo de equipo es 1 (SOLO).'
    # %s: modo, tamaño de equipo, máximo de jugadores
    team-size: '{prefix}&7Modo &e%s&7, equipos de &e%s&7. Máximo: &e%s &7jugadores.'
    map-saved: '{prefix}&7El mapa de &e%s &7se guardó en la carpeta &emaps&7.'
    rename:
      title: '&a&lNombre de la arena'
      subtitle: '&7Escribe el nuevo nombre en el chat'
      actionbar: '&fActual: &r%s'
      # %s: arena, nombre nuevo
      done: '{prefix}&7Nombre visible de &e%s&7: &r%s'
    # Botones del editor (/sw arena edit). En textos con varios valores: %1$s, %2$s...
    items:
      back:
        name: '&b« &eVolver'
        lore: |-
          &7
          &f Vuelve al menú anterior.
          &7
      spawn-point:
        lore: |-
          &7
          &f Arena: &r%s
          &7
          &e Clic izquierdo para eliminar.
          &e Clic derecho para ir.
          &7
      display-name:
        name: '&7» &bNombre visible'
        lore: |-
          &7
          &f Cambia el nombre que
          &f verán los jugadores.
          &7
          &f Actual: &r%s
          &7
          &e Haz clic para cambiarlo.
      save-map:
        name: '&7» &bGuardar el mapa'
        lore: |-
          &7
          &f Guarda y reemplaza el
          &f mapa de la arena.
          &7
      enable:
        name: '&7» &aActivar arena'
        lore: |-
          &7
          &f Cambia el modo de la arena
          &f para poder jugarla.
          &7
          &f Estado: &cDesactivada&f.
          &7
          &e Haz clic para cambiarlo.
      disable:
        name: '&7» &cDesactivar arena'
        lore: |-
          &7
          &f Cambia el modo de la arena
          &f para poder editarla.
          &7
          &f Estado: &aActivada&f.
          &7
          &e Haz clic para cambiarlo.
      min-players:
        name: '&7» &bMínimo de jugadores'
        lore: |-
          &7
          &f Cambia el número mínimo
          &f de jugadores.
          &7
          &f Actual: &e%s
          &7
          &e Clic izquierdo para aumentar.
          &e Clic derecho para disminuir.
      team-size:
        name: '&7» &bModo y tamaño de equipo'
        lore: |-
          &7
          &f Cada punto de aparición es un equipo.
          &f Tamaño 1 = SOLO, 2 o más = TEAM.
          &7
          &f Modo: &e%1$s
          &f Tamaño de equipo: &e%2$s
          &f Máximo de jugadores: &e%3$s
          &7
          &e Clic izquierdo para aumentar.
          &e Clic derecho para disminuir.
      checklist:
        name: '&7» &bLo que falta'
        lore: |-
          &7
          &f Para activar la arena tiene
          &f que estar todo en &a✔&f.
          &7
      spectators:
        name: '&7» &bSpawn de espectadores'
        lore: |-
          &7
          &f Donde aparecen los espectadores.
          &f También es el centro del mapa:
          &f las jaulas miran hacia él.
          &7
          &f Estado: %s
          &7
          &e Haz clic para ir.
      lobby:
        name: '&7» &bSala de espera'
        lore: |-
          &7
          &f Donde esperan los que van entrando.
          &f A falta de &e%2$s &fsegundos pasan
          &f a sus jaulas. Obligatoria en TEAM.
          &7
          &f Estado: %1$s
          &7
          &e Clic izquierdo para ir.
          &e Clic derecho para quitarla.
      spawns:
        name: '&7» &bPuntos de aparición'
        lore: |-
          &7
          &f Cada uno es un equipo, con su
          &f jaula (de 3x3 en TEAM).
          &7
          &f Spawns: &e%s
          &7
          &e Haz clic para verlos.
      balloon-spawns:
        name: '&7» &bPuntos de aparición de globos'
        lore: |-
          &7
          &f Modifica los puntos de
          &f aparición de los globos.
          &7
          &f Spawns de globos: &e%s
          &7
          &e Haz clic para verlos.
      tools:
        name: '&7» &bHerramientas'
        lore: |-
          &7
          &f Te vuelve a dar las herramientas
          &f del editor en la barra.
          &7
          &e Haz clic para obtenerlas.
      exit:
        name: '&7» &cSalir del editor'
        lore: |-
          &7
          &f Dejas de editar y recuperas
          &f tu inventario.
          &7
      delete:
        name: '&7» &cBorrar arena'
        lore: |-
          &7
          &f Borra esta arena. Podrás elegir
          &f si también se borra su mapa.
          &7
          &e Haz clic para elegir.
  select:
    title: '&8&lS&7&lS&0 » Editor de arenas'
    next-page: '&7Página siguiente &b»'
    previous-page: '&b« &7Página anterior'
    maps: '&7» &bMapas'
    worlds: '&7» &bMundos'
    map-lore: |-
      &7
      &e Clic izquierdo &fpara cargar este mapa.
      &c Clic derecho &fpara eliminar este mapa.
      &7
    map-loaded-lore: |-
      &c Este mapa ya está cargado en los mundos.
      &7
    world-lore: |-
      &7
      &e Clic izquierdo &fpara ir a este mundo.
      &c Clic derecho &fpara eliminar este mundo.
      &7
    # %s: mapa
    map-loaded: '{prefix}&a¡Has cargado el mapa &e%s&a!'
  arena:
    exists: '{prefix}&cEsa arena ya existe.'
    invalid-name: '{prefix}&cEl nombre solo puede tener letras, números, - y _.'
    creating: '{prefix}&7Creando arena...'
    world-created: '{prefix}&7No había mapa con ese nombre: se creó un &emundo vacío&7.'
    # %s: error
    create-error: '{prefix}&cAlgo salió mal al crear la arena: &e%s'
    usage-create: '{prefix}&cUso: &e/sw arena create <nombre>'
    not-found: '{prefix}&c¡Esa arena no existe!'
    not-editing: '{prefix}&c¡No estás editando ninguna arena!'
    # %s: arenas
    list: '{prefix}&7Arenas disponibles: &e%s'
    help:
      header: |-
        &7
        {prefix}&fAyuda &7● &eArenas
        &7
      create: '&7 /sw arena create <nombre> - &eCrea una arena (y un mundo vacío si no hay mapa) y la edita.'
      edit: '&7 /sw arena edit [nombre] - &eEdita una arena (sin nombre: mapas y mundos).'
      editor: '&7 /sw arena editor - &eAbre el menú de la arena que editas.'
      tools: '&7 /sw arena tools - &eTe da las herramientas del editor.'
      check: '&7 /sw arena check - &eMuestra lo que le falta para poder jugarse.'
      save: '&7 /sw arena save - &eGuarda el mapa en la carpeta de mapas.'
      delete: '&7 /sw arena delete - &eBorra la arena que editas (y, si quieres, su mapa).'
      exit: '&7 /sw arena exit - &eDeja de editar.'
      list: '&7 /sw arena list - &eMuestra las arenas disponibles.'
  # Editor de arenas: herramientas, marcadores y lista de lo que falta.
  setup:
    # %s: arena
    started: '{prefix}&7Editando &e%s&7. Las herramientas están en tu barra.'
    guide: |-
      &7
      &a Vara de blaze&f: izq. en un bloque añade un spawn; der. quita el más cercano.
      &b Ojo de ender&f: el spawn de espectadores (y el centro del mapa) donde estás.
      &e Estrella&f: la sala de espera donde estás (agachado: quitarla).
      &d Rienda&f: igual que la vara, para los globos.
      &f Cristal&f: ver u ocultar las jaulas en los spawns.
      &7 Cada punto se ve con partículas de su color.
      &7
    stopped: '{prefix}&7Ya no estás editando &e%s&7.'
    wrong-world: '{prefix}&cVe al mundo de &e%s &cpara usar las herramientas.'
    # %s: número
    spawn-added: '{prefix}&7Spawn &aañadido &8(#%s)'
    spawn-removed: '{prefix}&7Spawn &cquitado &8(#%s)'
    balloon-added: '{prefix}&7Spawn de globo &aañadido &8(#%s)'
    balloon-removed: '{prefix}&7Spawn de globo &cquitado &8(#%s)'
    spawn-too-close: '{prefix}&eOjo: está muy cerca de otro spawn y sus jaulas se pueden pisar.'
    point-exists: '{prefix}&cYa hay un punto ahí.'
    nothing-near: '{prefix}&cNo hay ningún punto a menos de 3 bloques.'
    point-missing: '{prefix}&cEse punto todavía no está puesto.'
    spectator-set: '{prefix}&a¡Spawn de espectadores establecido!'
    # %s: segundos
    lobby-set: '{prefix}&a¡Sala de espera establecida! &7A falta de &e%s &7segundos pasarán a las jaulas.'
    lobby-removed: '{prefix}&7Sala de espera &cquitada&7: se esperará dentro de las jaulas.'
    # %s: modo
    preview-on: '{prefix}&7Jaulas de &e%s &7puestas en los spawns. Se quitan solas al guardar.'
    preview-off: '{prefix}&7Jaulas quitadas.'
    # %s: arena, spawns, espectadores, sala de espera
    actionbar: '&fEditando &a%s &8| &fSpawns: &e%s &8| &fEspectadores: %s &8| &fSala: %s'
    state:
      done: '&a✔'
      missing: '&c✘'
      optional: '&7-'
    optional: '&8(opcional)'
    check:
      # %s: spawns
      spawns: '&fSpawns: &e%s &7(mínimo 2)'
      spectators: '&fSpawn de espectadores'
      lobby: '&fSala de espera'
      # %s: mínimo, máximo
      min-players: '&fMínimo de jugadores: &e%s&7/&e%s'
      balloons: '&fSpawns de globos: &e%s'
    # %s: arena
    check-header: '{prefix}&7Lo que necesita &e%s&7:'
    check-ready: '{prefix}&a¡Lista! &7Actívala desde el menú (&e/sw arena editor&7).'
    check-missing: '{prefix}&cTodavía le falta lo que está en &c✘&c.'
    cannot-enable: '{prefix}&cTodavía no se puede activar. Falta:'
    tools:
      spawns:
        name: '&aSpawns &7(Clic)'
        lore: |-
          &7
          &e Clic izquierdo &fen un bloque: añadir spawn.
          &e Clic derecho&f: quitar el más cercano.
          &7
      spectators:
        name: '&bSpawn de espectadores &7(Clic)'
        lore: |-
          &7
          &f Lo pone donde estás, mirando
          &f hacia donde miras.
          &7
      lobby:
        name: '&eSala de espera &7(Clic)'
        lore: |-
          &7
          &f La pone donde estás.
          &e Agachado&f: quitarla.
          &7
      balloons:
        name: '&dSpawns de globos &7(Clic)'
        lore: |-
          &7
          &e Clic izquierdo &fen un bloque: añadir.
          &e Clic derecho&f: quitar el más cercano.
          &7
      preview:
        name: '&fVer jaulas &7(Clic)'
        lore: |-
          &7
          &f Pone o quita la jaula por defecto
          &f en cada spawn (la de 3x3 en TEAM).
          &7
      menu:
        name: '&6Menú del editor &7(Clic)'
        lore: |-
          &7
          &f Ajustes de la arena y lo que
          &f le falta para jugarse.
          &7
      exit:
        name: '&cSalir del editor &7(Clic)'
        lore: |-
          &7
          &f Dejas de editar y recuperas
          &f tu inventario.
          &7
  # Borrar una arena (/sw arena delete o el botón del editor).
  delete:
    title: '&8&lS&7&lS&0 » Borrar arena'
    items:
      arena-only:
        name: '&6Borrar solo la arena'
        lore: |-
          &7
          &f Se borran los ajustes de &e%s
          &f (spawns, sala, globos...).
          &f El mapa se queda en &emaps &fy su
          &f mundo, para volver a crearla con
          &e /sw arena create&f.
          &7
          &e Haz clic para borrarla.
      subject:
        name: '&e%1$s'
        lore: |-
          &7
          &f Nombre visible: &r%2$s
          &f Spawns: &e%3$s
          &7
      with-map:
        name: '&cBorrar arena y mapa'
        lore: |-
          &7
          &f Se borran los ajustes de &e%s&f,
          &f su mapa de &emaps &fy su mundo.
          &7
          &c No se puede deshacer.
          &7
          &e Haz clic para borrarlo todo.
    # %s: instancias
    in-use: '{prefix}&cNo se puede borrar: &e%s &cestá jugando ese mapa. Espera a que cambie de mapa.'
    # %s: arena
    done: '{prefix}&7Se borró la arena &e%s&7. Su mapa sigue en &emaps&7.'
    done-with-map: '{prefix}&7Se borró la arena &e%s &7y su mapa.'
    error: '{prefix}&cNo se pudo borrar todo de &e%s&c, revisa la consola.'
  reload:
    # %s: qué se recarga (admin.reload.targets)
    start: '{prefix}&7Recargando %s...'
    done: '{prefix}&a¡Se recargó %s!'
    error: '{prefix}&cNo se pudo recargar %s, revisa la consola.'
    targets:
      all: 'todos los archivos'
      config: 'config.yml'
      messages: 'el prefijo (las traducciones se recargan con /core reload)'
      scoreboard: 'el marcador y los hologramas'
      chests: 'los cofres'
      trails: 'trails.yml'
      killsounds: 'killSounds.yml'
      boxes: 'boxes.yml'
      balloons: 'balloons.yml'
      menus: 'los menús'
      shop: 'shop.yml'
      abilities: 'abilities.yml'
    help:
      header: |-
        &7
        {prefix}&fAyuda &7● &eRecargar
        &7
      all: '&7 /sw reload all - &eRecarga todo lo de abajo.'
      config: '&7 /sw reload config - &eRecarga config.yml.'
      messages: '&7 /sw reload messages - &eRefresca el prefijo (traducciones: /core reload).'
      score: '&7 /sw reload score - &eRecarga el marcador y los hologramas.'
      chests: '&7 /sw reload chests - &eRecarga los cofres.'
      shops: '&7 /sw reload shops - &eRecarga la tienda y las habilidades.'
      trails: '&7 /sw reload trails - &eRecarga los rastros.'
      killsounds: '&7 /sw reload killsounds - &eRecarga los sonidos de baja.'
      boxes: '&7 /sw reload boxes - &eRecarga las cajas.'
      balloons: '&7 /sw reload balloons - &eRecarga los globos.'
      menus: '&7 /sw reload menus - &eRecarga los menús.'
  revive:
    not-partner: '{prefix}&c¡No eres un miembro partner!'
    not-in-arena: '{prefix}&c¡Debes estar en una arena para hacer esto!'
    # %s: comando
    usage: '{prefix}&cUso: &e/%s [jugador]'
    not-ingame: '{prefix}&c¡Este comando solo funciona en una partida en juego!'
    not-found: '{prefix}&c¡Ese jugador no está en la partida!'
    not-dead: '{prefix}&c¡Ese jugador no está muerto!'
    # %s: jugador
    done: '{prefix}&a¡Reviviste a &e%s&a!'
  hologram:
    usage-top: '{prefix}&cUso: &e/sw hologram top [id] add|remove <#>'
    # %s: id
    no-leaderboard: '{prefix}&cNo existe la clasificación &e%s &cen holograms.yml.'
    added: '{prefix}&7Holograma &aañadido &8(#%s)'
    none: '{prefix}&cNo hay hologramas que quitar.'
    invalid-number: '{prefix}&cNúmero inválido: &e%s'
    not-found: '{prefix}&cNo existe el holograma &e#%s&c.'
    removed: '{prefix}&7Holograma &cquitado &8(#%s)'
    usage: '{prefix}&cUso: &e/sw hologram add|remove <#>'
  lobby-spawn:
    set: '{prefix}&a¡Spawn del lobby establecido!'
  signs:
    already-exists: '{prefix}&cYa hay un cartel en esa posición.'
    added: '{prefix}&a¡Cartel añadido!'
    wall-only: '{prefix}&cEl cartel debe estar en una pared.'
    deleted: '{prefix}&7Cartel &celiminado&7.'
  tp:
    usage: '{prefix}&cUso: &e/sw tp [mundo]'
    # %s: mundos
    worlds: '{prefix}&7Mundos cargados: &e%s'
    not-found: '{prefix}&c¡Ese mundo no existe!'

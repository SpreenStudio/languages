  unknown-game: '{prefix}&cThere is no game called &e%s&c.'
  # %s: player
  player-not-found: '{prefix}&cPlayer &e%s &cis not online.'
  which-arena: '{prefix}&cThere are several arenas: name one at the end of the command.'
  not-playing: '{prefix}&cThat arena is not in the middle of a game.'
  # %s: player
  cannot-revive: '{prefix}&cCannot revive &e%s&c: they did not die in a running game.'
  usage:
    assign: '{prefix}&cUsage: &e/assign on|off&c, &e/assign random &cor &e/assign [player] [player]'
    border: '{prefix}&cUsage: &e/uhc border [radius] <arena> &7(between 5 and the map radius)'
    pvp: '{prefix}&cUsage: &e/uhc pvp on|off <arena>'
    whitelist: '{prefix}&cUsage: &e/uhc whitelist on|off|list &cor &e/uhc whitelist add|remove [player]'
  help:
    # %s: version
    header: |-
      &7
      {prefix}&fHelp &7● &e<optional> / [required] &8(v%s)
      &7
    footer: '&7'
    join: '&7 /uhc join <game> - &eJoin a game.'
    leave: '&7 /uhc leave - &eLeave the game.'
    games: '&7 /uhc games - &eOpen the games menu.'
    vote: '&7 /uhc vote - &eVote for the scenarios of the game.'
    scenarios: '&7 /uhc scenarios - &eScenarios of the game.'
    stats: '&7 /uhc stats <player> - &eStatistics.'
    top: '&7 /uhc top <stat> - &eTop ten.'
    backpack: '&7 /uhc backpack - &eThe backpack of your team (Backpacks).'
    practice: '&7 /uhc practice - &eJoin or leave practice while you wait.'
    host: '&7 /uhc host <release> - &eClaim the game as host (or release it) and open its panel.'
    start: '&7 /uhc start - &eStart the game you host.'
    scenario: '&7 /uhc scenario [scenario] - &eToggle a scenario.'
    whitelist: '&7 /uhc whitelist on|off|add|remove|list - &eWhitelist of your game.'
    border: '&7 /uhc border [radius] <arena> - &eShrink the border now.'
    heal: '&7 /uhc heal <arena> - &eHeal everyone.'
    pvp: '&7 /uhc pvp on|off <arena> - &eEnable or disable PvP.'
    respawn: '&7 /uhc respawn [player] - &ePut a dead player back in the game.'
    end: '&7 /uhc end <arena> - &eEnd the game with no winner.'
    world: '&7 /uhc world - &eTemplate worlds: generate, list and delete.'
    setlobby: '&7 /uhc setlobby - &eSet the lobby spawn.'
    reload: '&7 /uhc reload - &eReload the files.'
    debug: '&7 /uhc debug - &eState of the arenas and the world pool.'

admin:
  lobby-set: '{prefix}&7Lobby spawn &aset &7where you are standing.'
  reloaded: '{prefix}&aFiles reloaded. &7Arenas use the new rules after they restart.'

# Template worlds (/uhc world).
world:
  help:
    - '&7'
    - '{prefix}&fHelp &7● &eTemplate worlds'
    - '&7'
    - '&7 /uhc world generate <name|amount> <radius> - &eGenerate worlds for the pool.'
    - '&7 /uhc world list - &eThe worlds in the pool.'
    - '&7 /uhc world delete [name] - &eDelete a world from the pool.'
    - '&7 /uhc world status - &eWhat is being generated.'
    - '&7'
  not-here: '{prefix}&cA server in LOBBY mode has no game worlds.'
  invalid-name: '{prefix}&cThe name may only contain letters, numbers, - and _.'
  # %s: world
  exists: '{prefix}&cThere is already a world called &e%s&c.'
  unknown: '{prefix}&cThere is no world called &e%s&c.'
  deleted: '{prefix}&7World &e%s &cdeleted&7.'
  in-use: '{prefix}&cWorld &e%s &cis being played right now! Wait until the arena switches worlds.'
  idle: '{prefix}&7No world is being generated.'
  # %1$s: world and percentage, %2$s: queued
  status: '{prefix}&7Generating &e%1$s &8(&7%2$s more queued&8)'
  generate:
    # %s: how many
    queued: '{prefix}&7Queued &e%s &7world(s). The server will be slower while they are generated.'
    # %1$s: world, %2$s: radius
    start: '{prefix}&7Generating world &e%1$s &7(radius %2$s)...'
    # %1$s: world, %2$s: percentage
    progress: '{prefix}&7World &e%1$s&7: &a%2$s%%'
    # %s: world
    done: '{prefix}&aWorld &e%s &ais ready and stored in the pool.'
    failed: '{prefix}&cCould not generate world &e%s&c, check the console.'
  list:
    # %s: how many
    header: '{prefix}&7Worlds in the pool: &e%s'
    # %1$s: world, %2$s: radius, %3$s: with or without Nether
    line: ' &8● &e%1$s &7radius &f%2$s &8- %3$s'
    with-nether: '&awith Nether'
    without-nether: '&cno Nether'

stats:
  # %1$s: player, %2$s: wins, %3$s: games, %4$s: kills, %5$s: deaths, %6$s: KDR,

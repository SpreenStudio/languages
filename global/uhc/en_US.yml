prefix: '&6&lUHC &8» '

general:
  loading: '&cYour data is still loading, join again in a few seconds.'

# Used by GameCore when moving players around.
player:
  teleport:
    lobby: '{prefix}&7Going back to the &elobby&7...'

game:
  no-games: '{prefix}&cThere is no free game right now! Try again in a few seconds.'
  # %s: game
  sending: '{prefix}&7Sending you to &e%s&7...'
  queued: '{prefix}&7No free games: &eyou will join as soon as there is one&7.'
  loading: '{prefix}&cThat game is still preparing its world. Try again in a few seconds.'
  in-progress: '{prefix}&cThat game has already started!'
  full: '{prefix}&cThat game is full!'
  whitelisted: '{prefix}&cThat game is whitelisted and you are not on the list.'
  spectate-unavailable: '{prefix}&cThat player is no longer playing.'
  # %1$s: player, %2$s: players, %3$s: maximum
  join: '{prefix}&e%1$s &7joined &8(&a%2$s&8/&a%3$s&8)'
  quit: '{prefix}&e%1$s &7left &8(&c%2$s&8/&c%3$s&8)'
  you-left: '{prefix}&7You left the game.'
  now-spectating: '{prefix}&7You are now a &espectator&7. Use the compass to follow someone.'
  # %s: player
  revived: '{prefix}&e%s &7is back in the game.'
  start:
    # %s: time
    countdown: '{prefix}&7The game starts in &e%s&7.'
    cancelled: '{prefix}&cNot enough players: countdown cancelled.'
  scatter:
    start: '{prefix}&7Scattering players across the map... &eStay still!'
  started: '{prefix}&aThe game has started! &7Good luck.'
  heal:
    # %s: time
    countdown: '{prefix}&7Final heal in &e%s&7.'
    done: '{prefix}&aFinal heal! &7Everyone is at full health. No more heals.'
  pvp:
    # %s: time
    countdown: '{prefix}&7PvP will be enabled in &c%s&7.'
    enabled: '{prefix}&cPvP is now enabled!'
    disabled: '{prefix}&aPvP has been disabled.'
  border:
    # %1$s: radius, %2$s: time
    countdown: '{prefix}&7The border shrinks to &c%1$s &7in &c%2$s&7.'
    # %s: radius
    shrunk: '{prefix}&cThe border has shrunk to %s blocks!'
  nether:
    closed: '{prefix}&cThe Nether is now closed. &7Everyone inside was sent back to the surface.'
    disabled: '{prefix}&cThe Nether is closed in this game.'
  end:
    draw: '{prefix}&7The game ended &ewith no winner&7.'
    # %1$s: winner, %2$s: kills
    solo: '{prefix}&6&l%1$s &6&lwon the game! &7(%2$s kills)'
    # %1$s: team, %2$s: players, %3$s: team kills
    team: '{prefix}&6&lTeam %1$s &6&lwon! &7%2$s &8(&7%3$s kills&8)'

time:
  # %s: amount
  minutes: '%s min'
  seconds: '%s s'

death:
  # %1$s: victim, %2$s: their kills, %3$s: killer, %4$s: their kills
  slain: '%1$s&7[&f%2$s&7] &ewas slain by %3$s&7[&f%4$s&7]&e.'
  # %1$s: victim, %2$s: their kills
  died: '%1$s&7[&f%2$s&7] &edied.'
  left: '%1$s&7[&f%2$s&7] &eleft the game.'
  logger-slain: '%1$s&7[&f%2$s&7] &8(offline) &ewas slain by %3$s&7[&f%4$s&7]&e.'
  logger-died: '%1$s&7[&f%2$s&7] &8(offline) &edied.'
  logger-expired: '%1$s&7[&f%2$s&7] &edid not come back in time and is out.'

logger:
  # %1$s: player, %2$s: minutes
  spawned: '{prefix}&e%1$s &7disconnected: they have &e%2$s min &7to come back.'
  # %s: player
  returned: '{prefix}&e%s &7is back in the game.'

team:
  # %s: team
  joined: '{prefix}&7You are in team %s&7.'
  eliminated: '{prefix}&cTeam %s &chas been eliminated.'
  no-team: '{prefix}&cThis is not a team game.'
  chat-on: '{prefix}&7Team chat &aenabled&7: only your team will see what you write.'
  chat-off: '{prefix}&7Team chat &cdisabled&7.'
  # %1$s: team, %2$s: player, %3$s: message
  chat: '&8[%1$s&8] &f%2$s&8: &a%3$s'
  # %1$s: team, %2$s: player, %3$s %4$s %5$s: x y z, %6$s: dimension
  coords: '&8[%1$s&8] &f%2$s &7is at &ex: %3$s&7, &ey: %4$s&7, &ez: %5$s &8(%6$s)'

host:
  # %s: player
  claimed: '{prefix}&e%s &7is now the &6host &7of this game: they set the rules and start it.'
  info: '{prefix}&7This game is hosted by &6%s&7. Check its rules with &e/scenarios&7.'
  released: '{prefix}&7The game is &eautomatic &7again.'
  starting: '{prefix}&6%s &7started the game.'
  not-host: '{prefix}&cYou are not hosting this game!'
  too-late: '{prefix}&cThe game has already started.'
  claim-first: '{prefix}&cThis game is automatic. Claim it first with &e/uhc host&c.'
  whitelist:
    enabled: '{prefix}&7The whitelist is &aenabled&7.'
    disabled: '{prefix}&7The whitelist is &cdisabled&7.'
    # %s: player
    added: '{prefix}&e%s &7added to the whitelist.'
    removed: '{prefix}&e%s &7removed from the whitelist.'
    # %s: players
    list: '{prefix}&7Whitelist: &e%s'

scenarios:
  header: '{prefix}&7Scenarios of this game:'
  # %1$s: scenario, %2$s: description
  line: ' &8● &e%1$s &8- &7%2$s'
  none: '{prefix}&7This game has no scenarios.'
  voting-open: '{prefix}&7Scenarios are being voted. Open the vote with &e/uhc vote&7.'
  # %s: scenario
  enabled: '{prefix}&7Scenario &e%s &aenabled&7.'
  disabled: '{prefix}&7Scenario &e%s &cdisabled&7.'
  # %s: existing scenarios
  unknown: '{prefix}&cThat scenario does not exist. &7Available: &e%s'
  vote:
    # %s: scenario
    added: '{prefix}&7You voted for &e%s&7.'
    removed: '{prefix}&7You removed your vote for &e%s&7.'
    limit: '{prefix}&cYou have used all your votes! &7Remove one to vote for another.'
  noclean:
    # %s: seconds
    start: '{prefix}&aNoClean: &7you are protected from PvP for &e%s s&7.'
    end: '{prefix}&cNoClean: &7your protection has ended.'
    # %s: player
    protected: '{prefix}&e%s &7is protected by &aNoClean&7.'
    lost: '{prefix}&cNoClean: &7you attacked and lost your protection.'
  backpacks:
    # %s: team (the title cannot be longer than 32 characters)
    title: '&8Backpack of team %s'
    unavailable: '{prefix}&cThe backpack is only available in &eBackpacks &cgames while you are alive.'
  # Name and description of each scenario (menus and /scenarios).
  list:
    cutclean:
      name: 'CutClean'
      description:
        - '&7Iron and gold drop already smelted'
        - '&7and food drops cooked.'
    doubleores:
      name: 'DoubleOres'
      description:
        - '&7Every ore drops twice as much.'
    tripleores:
      name: 'TripleOres'
      description:
        - '&7Every ore drops three times as much.'
    timebomb:
      name: 'TimeBomb'
      description:
        - '&7The items of a dead player go into a chest'
        - '&7that explodes a few seconds later.'
    noclean:
      name: 'NoClean'
      description:
        - '&7After a kill you are protected from PvP'
        - '&7for a few seconds (until you attack).'
    hasteyboys:
      name: 'HasteyBoys'
      description:
        - '&7Tools are crafted with'
        - '&7Efficiency III and Unbreaking I.'
    timber:
      name: 'Timber'
      description:
        - '&7Breaking a log fells the whole tree.'
    bowless:
      name: 'Bowless'
      description:
        - '&7No bows.'
    rodless:
      name: 'Rodless'
      description:
        - '&7No fishing rods.'
    swordless:
      name: 'Swordless'
      description:
        - '&7Swords cannot be crafted.'
    fireless:
      name: 'Fireless'
      description:
        - '&7Fire and lava deal no damage.'
    nofall:
      name: 'NoFall'
      description:
        - '&7No fall damage.'
    blooddiamonds:
      name: 'BloodDiamonds'
      description:
        - '&7Every diamond you mine costs you'
        - '&7half a heart.'
    bloodenchant:
      name: 'BloodEnchant'
      description:
        - '&7Every enchantment costs you'
        - '&7half a heart.'
    absorptionless:
      name: 'Absorptionless'
      description:
        - '&7Golden apples give no'
        - '&7absorption hearts.'
    luckyleaves:
      name: 'LuckyLeaves'
      description:
        - '&7Leaves may drop'
        - '&7golden apples.'
    switcheroo:
      name: 'Switcheroo'
      description:
        - '&7If you hit someone with an arrow,'
        - '&7you swap places.'
    webcage:
      name: 'WebCage'
      description:
        - '&7Where someone dies,'
        - '&7a sphere of cobwebs appears.'
    triplexp:
      name: 'TripleXP'
      description:
        - '&7Experience is worth three times as much.'
    backpacks:
      name: 'Backpacks'
      description:
        - '&7Each team shares a backpack:'
        - '&e/uhc backpack'
    barebones:
      name: 'Barebones'
      description:
        - '&7Only iron can be mined, there are no'
        - '&7enchantments or golden apples, and each'
        - '&7death drops a diamond, an apple, arrows and string.'
    coldweapons:
      name: 'ColdWeapons'
      description:
        - '&7No Fire Aspect or Flame.'

practice:
  disabled: '{prefix}&cPractice is disabled.'
  closed: '{prefix}&cPractice is closed: the game is about to start.'
  full: '{prefix}&cPractice is full!'
  joined: '{prefix}&7You are in &epractice&7. Leave with &e/practice&7.'
  left: '{prefix}&7You left practice.'
  # %s: player
  killed: '{prefix}&7You killed &e%s&7.'
  killed-by: '{prefix}&7You were killed by &e%s&7.'
  died: '{prefix}&7You died.'

assign:
  enabled: '{prefix}&7Assigned &efights &7are &aenabled&7.'
  disabled: '{prefix}&7Assigned &efights &7are &cdisabled&7.'
  # %1$s: one side, %2$s: the other
  announce: |-
    &7&m---------------------------------
    &6&lAssigned Fight
    %1$s &7vs. %2$s
    &7&m---------------------------------
  # %s: opponents
  you: '{prefix}&eYou have been assigned against&7: %s'
  no-interrupt: '{prefix}&cYou are not allowed to interrupt an assigned fight!'
  must-fight: '{prefix}&cYou must fight against&7: %s'
  not-enabled: '{prefix}&cEnable assigned fights first with &e/assign on&c.'
  not-alive: '{prefix}&cBoth must be alive in the game.'
  same-side: '{prefix}&cThey are on the same team!'
  already: '{prefix}&cOne of them already has an assigned fight.'
  not-enough: '{prefix}&cThere are not two free teams left to pair.'

commands:

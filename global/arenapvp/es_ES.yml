      &7
      &f Pelea en cuevas: se puede picar
      &f y construir.
  training:
    name: 'Training'
    description: |-
      &7
      &f Partidas sencillas para practicar.
  sumo:
    name: 'Sumo'
    description: |-
      &7
      &f Sin daño: tira a tu rival del ring.
  boxing:
    name: 'Boxing'
    description: |-
      &7
      &f Sin daño: gana quien da antes
      &f 100 golpes.
  spleef:
    name: 'Spleef'
    description: |-
      &7
      &f Rompe la nieve bajo tu rival.
      &f Quien toca el agua, pierde.
  stickfight:
    name: 'Stick Fight'
    description: |-
      &7
      &f Palo de knockback y lana.
      &f Cada equipo tiene 5 vidas.
  thebridge:
    name: 'The Bridge'
    description: |-
      &7
      &f Cruza el puente y salta a la

    duel: '{prefix}&cUso: &e/duel [jugador] <modo> <rondas>&c, &e/duel accept|deny [jugador] &co &e/duel toggle&c.'
    kit: '{prefix}&cUso: &e/apvp kit save|reset|cancel'
    spect: '{prefix}&cUso: &e/spect [jugador]'

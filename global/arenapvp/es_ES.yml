      &f Sin pociones de daño.
  debuff:
    name: 'Debuff'
    description: |-
      &7
      &f Como NoDebuff, con pociones de
      &f veneno y lentitud.
  builduhc:
    name: 'BuildUHC'
    description: |-
      &7
      &f Se construye y no hay regeneración:
      &f manzanas y cabezas doradas.
  gapple:
    name: 'GApple'
    description: |-
      &7
      &f Armadura fuerte, fuerza y velocidad
      &f y muchas manzanas de Notch.
  combo:
    name: 'Combo'
    description: |-
      &7
      &f Golpes muy seguidos y knockback
      &f de combo.
  classic:
    name: 'Classic'
    description: |-
      &7
      &f Espada, arco y caña de toda la vida.
  axepvp:
    name: 'Axe PvP'
    description: |-
      &7
      &f Lucha con hachas.
  cavefight:
    name: 'Cave Fight'

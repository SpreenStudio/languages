prefix: '&c&lArenaPvP &8» '

general:
  loading: '&cYour data is still loading, please join again in a few seconds.'

# Used by GameCore while moving players around.
game:
  no-games: '{prefix}&cThere is no free arena right now! Try again in a few seconds.'
  # %s: game
  sending: '{prefix}&7Sending you to &e%s&7...'
  queued: '{prefix}&7No free arenas: &eyou will join as soon as one is free&7.'
player:
  teleport:
    lobby: '{prefix}&7Going back to the &elobby&7...'

commands:
  unknown: '{prefix}&cThat command does not exist! Use &e/apvp help&c.'
  only-players: '{prefix}&cThis option is for players only!'
  no-permission: '{prefix}&cYou do not have permission to do that!'
  error: '{prefix}&cSomething went wrong running the command, check the console.'
  only-lobby: '{prefix}&cYou can only do this in the lobby!'
  # %s: player
  player-not-found: '{prefix}&cThe player &e%s &cis not online.'
  # %s: mode
  unknown-mode: '{prefix}&cThere is no mode called &e%s&c.'
  not-in-match: '{prefix}&cYou are not in any match or queue!'
  usage:
    arena: '{prefix}&cUsage: &e/apvp arena create|edit [map], set [red|blue|spectators], region, goal|cage|cagespawn [red|blue], finish, miny <y>, modes [modes], instances [n], maxplayers [n], name [name], wand, check, save, exit, list, delete [map] <map>'
    duel: '{prefix}&cUsage: &e/duel [player] <mode> <rounds>&c, &e/duel accept|deny [player] &cor &e/duel toggle&c.'
    kit: '{prefix}&cUsage: &e/apvp kit save|reset|cancel'
    spect: '{prefix}&cUsage: &e/spect [player]'
  help:
    # %s: version
    header: |-
      &7
      {prefix}&fHelp &7● &e<optional> / [required] &8(v%s)
      &7
    footer: '&7'
    queue: '&7 /apvp queue <mode> <ranked> - &eJoin the queue of a mode.'
    leave: '&7 /apvp leave - &eLeave the queue, the match or the editor.'
    editkit: '&7 /apvp editkit <mode> - &eArrange the kit of a mode.'
    history: '&7 /apvp history <player> - &eLatest matches.'
    elo: '&7 /apvp elo <player> - &eELO in every mode.'
    menu: '&7 /apvp menu [id] - &eOpen an ArenaPvP menu.'
    setlobby: '&7 /apvp setlobby - &eSet the lobby spawn.'
    setkit: '&7 /apvp setkit [mode] - &eSave your inventory as the kit of a mode.'
    reload: '&7 /apvp reload <arenas> - &eReload the files (and the arenas).'
    debug: '&7 /apvp debug - &eState of the arenas and queues.'
    arena: '&7 /apvp arena - &eCreate and edit maps.'

admin:
  lobby-set: '{prefix}&7Lobby spawn &aset &7where you are.'
  # %s: mode
  kit-saved: '{prefix}&7Kit of &e%s &asaved &7from your inventory.'
  reloaded: '{prefix}&aFiles reloaded.'

teams:
  red: 'Red'
  blue: 'Blue'
  green: 'Green'
  yellow: 'Yellow'

modes:
  nodebuff:
    name: 'NoDebuff'
    description: |-
      &7
      &f Sword, pearls and healing potions.
      &f No harming potions.
  debuff:
    name: 'Debuff'
    description: |-
      &7
      &f Like NoDebuff, with poison and
      &f slowness potions.
  builduhc:
    name: 'BuildUHC'
    description: |-
      &7
      &f Building allowed and no regeneration:
      &f golden apples and golden heads.
  gapple:
    name: 'GApple'
    description: |-
      &7
      &f Strong armor, strength, speed
      &f and plenty of god apples.
  combo:
    name: 'Combo'
    description: |-
      &7
      &f Very fast hits and combo knockback.
  classic:
    name: 'Classic'
    description: |-
      &7
      &f The usual sword, bow and rod.
  axepvp:
    name: 'Axe PvP'
    description: |-
      &7
      &f Fight with axes.
  cavefight:
    name: 'Cave Fight'
    description: |-
      &7
      &f Fight in caves: mining and building
      &f allowed.
  training:
    name: 'Training'
    description: |-
      &7
      &f Simple matches to practice.
  sumo:
    name: 'Sumo'
    description: |-
      &7
      &f No damage: knock your rival off the ring.
  boxing:
    name: 'Boxing'
    description: |-
      &7
      &f No damage: first to land 100 hits wins.
  spleef:
    name: 'Spleef'
    description: |-
      &7
      &f Break the snow under your rival.
      &f Whoever touches the water loses.
  stickfight:
    name: 'Stick Fight'
    description: |-
      &7
      &f Knockback stick and wool.
      &f Each team has 5 lives.
  thebridge:
    name: 'The Bridge'
    description: |-
      &7
      &f Cross the bridge and jump into the
      &f enemy goal. 5 goals to win.
  battlerush:
    name: 'BattleRush'
    description: |-
      &7
      &f No damage: build your way to the
      &f enemy goal. 3 goals to win.
  survivalrun:
    name: 'Survival Run'
    description: |-
      &7
      &f Reach the finish before your rival.
      &f PvP starts halfway through.
  skywars:
    name: 'SkyWars'
    description: |-
      &7
      &f 1v1 SkyWars: loot the chests and
      &f knock your rival into the void.

items:
  unranked:
    name: '&aPlay unranked &7(Right click)'
    lore: |-
      &7
      &f Unranked matches of every mode.
      &7
      &e Click to choose a mode.
      &f
  ranked:
    name: '&bRanked &7(Right click)'
    lore: |-
      &7
      &f ELO matches: you are paired with
      &f players of your level.
      &7
      &e Click to choose a mode.
      &f
  party:
    name: '&dParty fight &7(Right click)'
    lore: |-
      &7
      &f Split your party into two teams.
      &f Leader only.
      &7
      &e Click to choose a mode.
      &f
  editor:
    name: '&6Kit editor &7(Right click)'
    lore: |-
      &7
      &f Arrange the items of every kit.
      &7
      &e Click to choose a kit.
      &f
  history:
    name: '&eStatistics &7(Right click)'
    lore: |-
      &7
      &f Your ELO and your latest matches.
      &7
      &e Click to see them.
      &f
  leave-queue:
    name: '&cLeave the queue &7(Right click)'
    lore: |-
      &7
      &f Stop looking for a match.
      &f
  golden-head:
    name: '&6Golden head'

queue:
  # %1$s: mode, %2$s: kind, %3$s: time
  actionbar: '&7Looking for &e%1$s &8(%2$s&8) &7· &f%3$s'
  # %s: mode, kind
  joined: '{prefix}&7Looking for a &e%s &8(%s&8) &7match. Use the red dye or &e/leave &7to leave.'
  left: '{prefix}&7You &cleft &7the queue.'
  # %s: mode
  matched: '{prefix}&aMatch found! &7Sending you to &e%s&7...'
  no-game: '{prefix}&7There are no free &e%s &7arenas right now; &eyou are still queued&7.'
  not-ranked: '{prefix}&c&e%s &cis not played ranked!'
  party-ranked: '{prefix}&cRanked is solo only! Leave your party to play.'
  party-use-menu: '{prefix}&7You are in a party: use the &dParty fight &7menu to play with it.'
  in-match: '{prefix}&cYou are already in a match!'

match:
  kind:
    ranked: '&bRanked'
    unranked: '&aUnranked'
    duel: '&6Duel'
    party: '&dParty'
  # %1$s: player, %2$s: arrived, %3$s: expected
  player-joined: '{prefix}&e%1$s &7arrived. &8(&a%2$s&8/&a%3$s&8)'
  # %s: player
  player-left: '{prefix}&e%s &7left the match.'
  # %1$s: mode, %2$s: players, %3$s: kind, %4$s: rounds
  start-message:
    - '&8&m-------------------------------'
    - '&e&l%1$s &7(%3$s&7)'
    - '%2$s'
    - '&7Best of &e%4$s'
    - '&8&m-------------------------------'
  # %1$s: player, %2$s: ELO
  opponent-elo: '{prefix}&7Your rival &e%1$s &7has &b%2$s &7ELO.'
  countdown:
    # %s: seconds
    title: '&e%s'
    subtitle: '&7Get ready!'
  fight:
    title: '&cFight!'
    subtitle: ''
  # %1$s: round, %2$s: score
  round-start: '{prefix}&7Round &e%1$s &8(%2$s&8)'
  # %1$s: victim, %2$s: killer
  killed: '{prefix}%1$s &7was taken down by %2$s&7.'
  # %s: victim
  died: '{prefix}%s &7fell.'
  # %1$s: team, %2$s: score
  round-won: '{prefix}%1$s &7wins the round. &8(%2$s&8)'
  time-limit: '{prefix}&cTime is up! &7The match is a draw.'
  victory:
    title: '&a&lVICTORY!'
    subtitle: '&7Well played!'
  defeat:
    title: '&c&lDEFEAT'
    subtitle: '&7Better luck next time.'
  draw:
    title: '&e&lDRAW'
    subtitle: '&7Nobody wins this time.'
  nobody: '&7Nobody'
  # %1$s: mode, %2$s: winners, %3$s: duration
  summary:
    - '&8&m-------------------------------'
    - '&e&l%1$s &7· &f%3$s'
    - '&7Winner: %2$s'
  # %1$s: hits, %2$s: accuracy, %3$s: combo, %4$s: damage, %5$s: bow, %6$s: apples, %7$s: pearls
  stats:
    - '&7Hits: &f%1$s &8(&f%2$s%%&8) &7· Combo: &f%3$s'
    - '&7Damage: &c%4$s❤ &7· Bow: &f%5$s%% &7· Apples: &f%6$s &7· Pearls: &f%7$s'
    - '&8&m-------------------------------'
  # %1$s: points, %2$s: new ELO
  elo-gain: '&7ELO: &a+%1$s &8(&b%2$s&8)'
  elo-loss: '&7ELO: &c-%1$s &8(&b%2$s&8)'
  forfeit: '&7Your rival left the match.'
  cancelled-left: '{prefix}&cThe match is cancelled: someone left before it started.'
  cancelled-missing: '{prefix}&cThe match is cancelled: not every player arrived.'
  # %1$s: player, %2$s: hearts
  health-bar: '&e%1$s &7has &c%2$s❤'
  # %s: seconds
  pearl-cooldown: '{prefix}&cYou can use another pearl in &e%s &cs.'
  respawn:
    title: '&cYou fell!'
    # %s: seconds
    subtitle: '&7Back in &e%s&7...'
  you-left: '{prefix}&7You left the match.'

arena:
  only-matches: '{prefix}&cArenas can only be joined with a matched game.'
  mode-unavailable: '{prefix}&cThis arena does not have that mode; back to the lobby.'
  editor:
    # %s: map
    created: '{prefix}&7Map &e%s &acreated&7. Set the spawns with &e/apvp arena set red|blue&7 and use the golden axe for the zones.'
    editing: '{prefix}&7Editing &e%s&7. &e/apvp arena check &7tells you what is missing.'
    in-use: '{prefix}&cThe map &e%s &cis in use! Wait for its match to end.'
    not-editing: '{prefix}&cYou are not editing any map! Use &e/apvp arena edit [map]&c.'
    # %1$s: corner, %2$s %3$s %4$s: coordinates
    corner: '{prefix}&7Corner &e%1$s&7: &f%2$s, %3$s, %4$s'
    no-selection: '{prefix}&cMark both corners with the golden axe (left and right click).'
    # %s: point
    point-set: '{prefix}&7Point &e%s &asaved &7where you are.'
    # %s: zone
    zone-set: '{prefix}&7Zone &e%s &asaved &7from your selection.'
    # %1$s: key, %2$s: value
    value-set: '{prefix}&e%1$s&7: &f%2$s'
    complete: '{prefix}&aThe map is complete!'
    missing:
      red: '{prefix}&cThe red team spawn is missing &7(/apvp arena set red)&c.'
      blue: '{prefix}&cThe blue team spawn is missing &7(/apvp arena set blue)&c.'
      modes: '{prefix}&cSay which modes are played here &7(/apvp arena modes ...)&c.'
      goals: '{prefix}&cThe goals are missing &7(/apvp arena goal red|blue)&c.'
      finish: '{prefix}&cThe finish is missing &7(/apvp arena finish)&c.'
    # %s: map
    saved: '{prefix}&7Map &e%s &asaved &7to maps/. Use &e/apvp reload arenas &7to load it.'
    saved-incomplete: '{prefix}&7Map &e%s &asaved&7, but it is &cnot complete &7yet (&e/apvp arena check&7).'
    # %s: maps
    list: '{prefix}&7Maps: &e%s'
    deleted: '{prefix}&7Map &e%s &cdeleted&7.'
    exit: '{prefix}&7You left the map editor.'

spectate:

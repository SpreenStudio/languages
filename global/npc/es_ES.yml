# NPC (modulo de FurryCore, antes ServerNPC): textos en espanol de la seccion 'npc'.
# Variables entre llaves ({npc}, {skin}, {merchant}...). Los YAML de los menus usan las claves como
# [lang=npc]<clave>.

prefix: '&6&lNPC &8» '
general:
  enabled: '&a&lACTIVADO'
  disabled: '&c&lDESACTIVADO'
  'yes': '&aSí'
  'no': '&cNo'

commands:
  wand:
    help: '&7 /npc wand - &eTe da la varita para editar NPCs.'
  create:
    help: '&7 /npc create [nombre] [skin|mob] - &eCrea un NPC donde estás.'
    usage: '{prefix}&cUso: &e/npc create [nombre] [skin|mob]'
  delete:
    help: '&7 /npc delete [npc] - &eBorra un NPC.'
    usage: '{prefix}&cUso: &e/npc delete [npc]'
  skin:
    help: '&7 /npc skin [npc] [skin|mob] - &eCambia la skin o el mob de un NPC.'
    usage: '{prefix}&cUso: &e/npc skin [npc] [skin|mob]'
  inventory:
    help: '&7 /npc inventory [npc] - &eCambia el equipo de un NPC.'
    usage: '{prefix}&cUso: &e/npc inventory [npc]'
  lookclose:
    help: '&7 /npc lookclose [npc] <rango> - &eActiva o desactiva que mire a los jugadores, o cambia su rango (1-24).'
    usage: '{prefix}&cUso: &e/npc lookclose [npc] <rango>'
  display-name:
    help: '&7 /npc display-name [npc] [nombre] - &eCambia el nombre visible de un NPC.'
    usage: '{prefix}&cUso: &e/npc display-name [npc] [nombre]'
  rename:
    help: '&7 /npc rename [npc] [nuevo] - &eCambia el nombre (y el archivo) de un NPC.'
    usage: '{prefix}&cUso: &e/npc rename [npc] [nuevo]'
  action:
    help: |-
      &7 /npc action add [npc] [consola] [permiso] [TIPO:valor] - &eAñade una acción.
      &7 /npc action remove [npc] [id] - &eQuita una acción.
      &7 /npc action cooldown [npc] [milisegundos] - &eCambia la espera entre clics.
      &7 /npc action list [npc] - &eMuestra las acciones.
    usage: '{prefix}&cUso: &e/npc action [add|remove|cooldown|list] [npc] ...'
  glow:
    help: '&7 /npc glow [npc] <color> - &eActiva el brillo o cambia su color (1.9+).'
    usage: '{prefix}&cUso: &e/npc glow [npc] <color>'
  list:
    help: '&7 /npc list - &eMuestra todos los NPCs.'
  tphere:
    help: '&7 /npc tphere [npc] - &eMueve un NPC a tu posición.'
    usage: '{prefix}&cUso: &e/npc tphere [npc]'
  reload:
    help: |-
      &7 /npc reload all - &eRecarga los ajustes, los menús, los mercaderes y todos los NPCs.
      &7 /npc reload config - &eRecarga los ajustes, los menús y los mercaderes.
      &7 /npc reload npc [npc] - &eRecarga un NPC.
    usage: '{prefix}&cUso: &e/npc reload [all|config|npc] <npc>'
  import:
    help: '&7 /npc import [citizens|servernpc] - &eImporta los NPCs de Citizens o de ServerNPC.'
    usage: '{prefix}&cUso: &e/npc import [citizens|servernpc]'
  hologram:
    help: |-
      &7 /npc hologram add [npc] [texto] - &eAñade una línea al holograma.
      &7 /npc hologram set [npc] [línea] [texto] - &eCambia una línea.
      &7 /npc hologram remove [npc] [línea] - &eQuita una línea.
      &7 /npc hologram height [npc] [altura] - &eCambia la altura del holograma.
    usage: '{prefix}&cUso: &e/npc hologram [add|set|remove|height] [npc] ...'
  render:
    help: '&7 /npc render [npc] [distancia] - &eDesde qué distancia se ve un NPC (5-64).'
    usage: '{prefix}&cUso: &e/npc render [npc] [distancia]'
  merchant:
    help: |-
      &7 /npc merchant create [nombre] [título] - &eCrea un mercader.
      &7 /npc merchant open [nombre] - &eAbre un mercader.
      &7 /npc merchant recipes [nombre] - &eEdita los intercambios de un mercader.
      &7 /npc merchant delete [nombre] - &eBorra un mercader.
    usage: '{prefix}&cUso: &e/npc merchant [create|open|recipes|delete] [nombre] <título>'
  sit:
    help: '&7 /npc sit [npc] - &eSienta o levanta un NPC.'
    usage: '{prefix}&cUso: &e/npc sit [npc]'

messages:
  invalid-number: '{prefix}&e{value}&c no es un número válido.'
  interact:
    cooldown: '{prefix}&cEspera &e{time}s&c para volver a hacer clic.'
  npc:
    not-exist: '{prefix}&fEl NPC &c{npc}&f no existe. &c&l✖'
    invalid-name: '{prefix}&c&e{npc}&c no es un nombre válido: usa letras, números, _ o -.'
    created: '{prefix}&fNPC &e{npc}&f creado. &a&l✔'
    already-exist: '{prefix}&fEl NPC &e{npc}&f ya existe. &c&l✖'
    deleted: '{prefix}&fNPC &c{npc}&f borrado. &a&l✔'
    delete-error: '{prefix}&cNo se pudo borrar el archivo del NPC &e{npc}&c.'
    save-error: '{prefix}&cNo se pudo guardar el NPC &e{npc}&c. Mira la consola.'
    reloaded: '{prefix}&fNPC &a{npc}&f recargado. &a&l✔ &8(Muévete para verlo de nuevo)'
    reload-error: '{prefix}&cNo se pudo recargar el NPC &e{npc}&c. &c&l✖'
    display-name: '{prefix}&fNombre visible cambiado de &e{old}&f a &e{new}&f.'
    renamed: '{prefix}&fNPC &e{old}&f renombrado a &e{new}&f.'
    rename-error: '{prefix}&cNo se pudo renombrar &e{old}&c: &e{new}&c ya existe o no se pudo borrar el archivo.'
    moved: '{prefix}&aHas movido a &e{npc}&a a tu posición.'
    move-error: '{prefix}&cNo se pudo mover a &e{npc}&c.'
    look-close: '{prefix}&fMirar a los jugadores de &e{npc}&f: {state}&f.'
    look-range: '{prefix}&fRango de visión de &e{npc}&f cambiado a &e{range}&f.'
    look-range-invalid: '{prefix}&e{range}&c no es un rango válido (1-24).'
    render: '{prefix}&fAhora &e{npc}&f se ve desde &a{distance}&f bloques.'
    render-invalid: '{prefix}&e{distance}&c no es una distancia válida (5-64).'
    seated: '{prefix}&e{npc}&f ahora está sentado.'
    not-seated: '{prefix}&e{npc}&f ya no está sentado.'
    glow-unsupported: '{prefix}&cEl brillo de los NPCs necesita la versión 1.9 o superior, y este servidor es 1.8.'
    list:
      title: '{prefix}&fNPCs disponibles'
      empty: '  &e➥ &cNinguno'
      line: '  &e➥ &b{npc} &6➟&f Skin: &e{skin} &b▌ &fUbicación: &e{location}'
  skin:
    changing: '{prefix}&fCambiando la skin de &e{npc}&f a &a{skin}&f...'
    success: '{prefix}&fSkin de &e{npc}&f cambiada. &a&l✔'
    error: '{prefix}&cNo se pudo cambiar la skin de &e{npc}&c. &c&l✖'
    mob: '{prefix}&fAhora &e{npc}&f es un mob. &a&l✔'
    invalid-character: '{prefix}&cLa skin tiene un carácter no válido (%). ¿Está instalado PlaceholderAPI?'
  actions:
    title: '{prefix}&fAcciones de &e{npc}'
    empty: '  &e➥ &cNinguna'
    line: '  &e➥&f ID: {id} &a➟&f CONSOLA={console} &e▌&f PERMISO={permission} &e▌&f ACCIÓN={action}'
    added: '{prefix}&fAcción añadida. &a&l✔'
    removed: '{prefix}&fAcción quitada. &a&l✔'
    error-id: '{prefix}&cEsa acción no existe. &c&l✖'
    error-saving: '{prefix}&cNo se pudieron guardar las acciones. &c&l✖'
    error-type: '{prefix}&cLa acción debe ser &eTIPO:valor&c con un tipo válido (cmd, bgcmd, server, merchant, msg, sound, wait, labyEmote, UPDATE).'
    cooldown: '{prefix}&fAhora la espera entre clics de &e{npc}&f es de &e{time}&f ms.'
  hologram:
    added: '{prefix}&a&l✔&f Línea añadida: {line}'
    changed: '{prefix}&a&l✔&f Línea &b{line}&f cambiada por: {text}'
    removed: '{prefix}&fLínea &b{line}&f quitada del holograma de &e{npc}&f.'
    height: '{prefix}&fAltura del holograma cambiada a &e{height}&f.'
    increased: '{prefix}&fHolograma subido &e{amount}&f.'
    decreased: '{prefix}&fHolograma bajado &e{amount}&f.'
    empty: '{prefix}&cEl holograma no tiene líneas.'
    line-not-exist: '{prefix}&cLa línea &e{line}&c no existe.'
  inventory:
    set: '{prefix}&aHas puesto &e{item}&a en {slot}&a de &e{npc}&a.'
    removed: '{prefix}&aHas quitado {slot}&a de &e{npc}&a.'
    no-item: '{prefix}&cNecesitas un objeto en el cursor para cambiarlo.'
  mob:
    applied: '{prefix}&aCambios aplicados. Muévete para ver el NPC de nuevo.'
    size-help: |-
      {prefix}&eClic izquierdo: &a+1 &7| &eClic derecho: &c-1
      {prefix}&eCon shift suma o resta &a5&e.
  merchant:
    not-found: '{prefix}&fEl mercader &c{merchant}&f no existe. &c&l✖'
    created: '{prefix}&aMercader &e{merchant}&a creado.'
    exists: '{prefix}&cEl mercader &e{merchant}&c ya existe.'
    deleted: '{prefix}&aMercader &e{merchant}&a borrado.'
    saved: '{prefix}&aMercader &e{merchant}&a guardado.'
    drag: '{prefix}&c¡No se puede arrastrar aquí!'
  import:
    checking: '{prefix}&eBuscando NPCs de {plugin}...'
    no-folder: '{prefix}&cNo se encontraron los datos de {plugin}.'
    empty: '{prefix}&cNo hay NPCs de {plugin} que importar.'
    creating: '{prefix}&aCreando el NPC &e{npc}&a...'
    exists: '{prefix}&cEl NPC &e{npc}&c ya existe, se salta.'
    save-error: '{prefix}&cNo se pudo guardar el NPC &e{npc}&c, se salta.'
    merchant: '{prefix}&aMercader &e{merchant}&a importado.'
    merchant-exists: '{prefix}&cEl mercader &e{merchant}&c ya existe, se salta.'
    done: '{prefix}&a¡NPCs de {plugin} importados!'
  reload:
    all: '{prefix}&eSe han recargado los ajustes, los menús, los mercaderes, las skins y todos los NPCs.'
    config: '{prefix}&fAjustes recargados. &a&l✔'

editor:
  # Tambien vale 'cancel'.
  cancel-word: 'cancelar'
  cancelled: '{prefix}&cAcción cancelada.'
  skin: |-
    {prefix}&fEscribe en el chat la skin del NPC: un nombre de &aMojang&f, un enlace de &eMineskin.org&f, un mob o un placeholder.
    {prefix}&fEscribe &ccancelar&f para cancelar.
  hologram: |-
    {prefix}&fEscribe en el chat la línea del holograma.
    {prefix}&fEscribe &ccancelar&f para cancelar.
  action:
    type: '{prefix}&aTipo de acción: &e{type}&a.'
    value: |-
      &f
      {prefix}&fGenial, ahora escribe {what}.
      {prefix}&fEscribe &ccancelar&f para cancelar.
    permission: |-
      &f
      {prefix}&fUna cosa más: ¿la acción necesita un permiso? (&e!permiso&f para los que no lo tienen)
      {prefix}&fSi no, escribe &enone&f.
      {prefix}&fEscribe &ccancelar&f para cancelar.
    what:
      spigot-cmd: '&eel comando'
      bungee-cmd: '&eel comando del proxy'
      bungee-send: '&eel servidor'
      merchant: '&eel nombre del mercader'
      player-msg: '&eel mensaje'
      player-sound: '&eel sonido'
      wait: '&eel tiempo (en milisegundos)'
      laby-emote: '&eel emote (o random)'
      update: '&equé actualizar (GLOW)'

# Lo que hace cada tipo de accion (menu de nueva accion).
action-types:
  spigot-cmd: 'Ejecuta un comando.'
  bungee-cmd: 'Ejecuta un comando en el proxy.'
  bungee-send: 'Envía al jugador a otro servidor.'
  merchant: 'Abre un mercader.'
  player-msg: 'Envía un mensaje al jugador.'
  player-sound: 'Reproduce un sonido al jugador.'
  wait: 'Espera antes de las siguientes acciones.'
  laby-emote: 'El NPC hace un emote de LabyMod.'
  update: 'Vuelve a enviar el brillo del NPC.'

